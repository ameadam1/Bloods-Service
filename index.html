document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  <script type="__bundler/template">
"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"10ff5897-e58f-4e84-b410-c7dc3605ae4a\"><\u002Fscript>\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n<style>\n  body{margin:0;background:#f7f6f2;color:#1c1f23;font-family:-apple-system,BlinkMacSystemFont,\"Segoe UI\",Helvetica,Arial,sans-serif;}\n  a{color:#0f6e56;}\n  a:hover{color:#0c5c47;}\n  @media print{\n    .noprint{display:none !important;}\n    .a4{box-shadow:none !important;border:none !important;page-break-after:always;}\n  }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n\n<div style=\"min-height:100vh;background:#f7f6f2\">\n\n  <div style=\"height:4px;background:#102a43\"><\u002Fdiv>\n  <div style=\"background:#fff;border-bottom:1px solid #dfe0e0;padding:14px 24px;display:flex;align-items:center;gap:18px;flex-wrap:wrap\">\n    <img src=\"4f2b3abd-a825-4e59-9335-2b43a570a10a\" alt=\"Everest Pharmacy — healthcare at its peak\" style=\"height:40px;width:auto;display:block\">\n    <div style=\"border-left:1px solid #dfe0e0;padding-left:18px\">\n      <div style=\"font-size:16px;font-weight:600;letter-spacing:.2px;color:#102a43\">Bloods service<\u002Fdiv>\n      <div style=\"font-size:12px;color:#6b7280\">Service design pack v0.1<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"flex:1\"><\u002Fdiv>\n    <div style=\"font-size:11px;color:#0f6e56;background:#e1f5ee;border:1px solid #b9e3d2;border-radius:6px;padding:5px 10px;font-weight:600\">Everest is the CQC-registered provider · collection at Everest branches and partner spokes<\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"noprint\" style=\"background:#fff;border-bottom:1px solid #dfe0e0;padding:0 24px;display:flex;gap:4px;overflow-x:auto\">\n    <sc-for list=\"{{ navItems }}\" as=\"tab\" hint-placeholder-count=\"5\">\n      <button type=\"button\" sc-camel-on-click=\"{{ tab.go }}\" style=\"{{ tab.style }}\">{{ tab.label }}<\u002Fbutton>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n\n  <sc-if value=\"{{ isPatient }}\" hint-placeholder-val=\"{{ true }}\">\n  <div style=\"max-width:1180px;margin:0 auto;padding:28px 24px 80px;display:flex;gap:28px;align-items:flex-start;flex-wrap:wrap\">\n\n    <div style=\"flex:0 0 420px;max-width:100%;min-width:320px\">\n      <div style=\"background:#fff;border:1px solid #dfe0e0;border-radius:14px;padding:22px 22px 26px;box-shadow:0 1px 2px rgba(16,42,67,.05)\">\n\n        <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:18px\">\n          <img src=\"aaacdbd4-1078-4bb0-a1c0-d36ab9c63e74\" alt=\"Everest Pharmacy\" style=\"height:28px;width:28px;display:block\">\n          <div style=\"font-size:12px;font-weight:600;color:#6b7280;letter-spacing:.04em;text-transform:uppercase\">Book a blood test<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"height:5px;background:#eeeeec;border-radius:4px;overflow:hidden;margin-bottom:6px\">\n          <div style=\"{{ progressStyle }}\"><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-size:11px;color:#6b7280;margin-bottom:22px\">{{ progressLabel }}<\u002Fdiv>\n\n        <sc-if value=\"{{ stopped }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"background:#fcebeb;border:1px solid #f0cdcd;border-radius:10px;padding:18px\">\n            <div style=\"font-size:11px;font-weight:700;color:#a32d2d;letter-spacing:.05em;text-transform:uppercase;margin-bottom:8px\">{{ stopTag }}<\u002Fdiv>\n            <div style=\"font-size:16px;font-weight:600;color:#a32d2d;line-height:1.35;margin-bottom:10px\">{{ stopTitle }}<\u002Fdiv>\n            <div style=\"font-size:13.5px;color:#7c2626;line-height:1.6\">{{ stopBody }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background:#fff;border:1px solid #dfe0e0;border-radius:10px;padding:14px 16px;margin-top:12px;font-size:13px;line-height:1.6;color:#1c1f23\">\n            <strong style=\"display:block;color:#a32d2d;margin-bottom:4px\">If this is an emergency<\u002Fstrong>\n            Call 999. For urgent same-day advice call your GP or NHS 111.\n          <\u002Fdiv>\n          <button type=\"button\" sc-camel-on-click=\"{{ restart }}\" style=\"margin-top:20px;width:100%;padding:12px;border-radius:6px;border:1px solid #dfe0e0;background:#fff;color:#102a43;font-size:14px;font-weight:600;cursor:pointer\" style-hover=\"background:#f1f1f1\">Start again<\u002Fbutton>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ live }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"font-size:11px;font-weight:700;color:#0f6e56;letter-spacing:.06em;text-transform:uppercase;margin-bottom:8px\">{{ stepKicker }}<\u002Fdiv>\n          <div style=\"font-size:21px;font-weight:600;line-height:1.25;margin-bottom:8px\">{{ stepTitle }}<\u002Fdiv>\n          <div style=\"font-size:13.5px;color:#6b7280;line-height:1.55;margin-bottom:18px\">{{ stepHint }}<\u002Fdiv>\n\n          <sc-if value=\"{{ hasNotice }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"background:#e1f5ee;border:1px solid #b9e3d2;border-radius:10px;padding:14px 16px;font-size:12.5px;line-height:1.6;color:#0c5c47;margin-bottom:18px\">{{ noticeText }}<\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ isPanels }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display:flex;flex-direction:column;gap:10px\">\n              <sc-for list=\"{{ panelCards }}\" as=\"p\" hint-placeholder-count=\"6\">\n                <div style=\"{{ p.cardStyle }}\" sc-camel-on-click=\"{{ p.pick }}\">\n                  <div style=\"display:flex;align-items:flex-start;gap:10px\">\n                    <div style=\"{{ p.dot }}\"><\u002Fdiv>\n                    <div style=\"flex:1;min-width:0\">\n                      <div style=\"display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:3px\">\n                        <span style=\"font-size:14.5px;font-weight:600;line-height:1.35\">{{ p.name }}<\u002Fspan>\n                        <span style=\"{{ p.recStyle }}\">Recommended<\u002Fspan>\n                      <\u002Fdiv>\n                      <div style=\"font-size:12px;line-height:1.5;color:#6b7280\">{{ p.tests }}<\u002Fdiv>\n                    <\u002Fdiv>\n                    <button type=\"button\" sc-camel-on-click=\"{{ p.toggle }}\" title=\"What does this test?\" style=\"{{ p.infoStyle }}\">{{ p.infoLabel }}<\u002Fbutton>\n                  <\u002Fdiv>\n                  <div style=\"{{ p.detailStyle }}\">\n                    <div style=\"font-size:14px;font-weight:600;line-height:1.4;margin-bottom:7px\">{{ p.question }}<\u002Fdiv>\n                    <div style=\"font-size:13px;line-height:1.6;color:#1c1f23;margin-bottom:12px\">{{ p.body }}<\u002Fdiv>\n                    <div style=\"font-size:10.5px;font-weight:700;color:#6b7280;letter-spacing:.05em;text-transform:uppercase;margin-bottom:7px\">What it tells you<\u002Fdiv>\n                    <div style=\"display:flex;flex-direction:column;gap:6px;margin-bottom:12px\">\n                      <sc-for list=\"{{ p.tells }}\" as=\"t\" hint-placeholder-count=\"4\">\n                        <div style=\"display:flex;gap:8px;align-items:flex-start\">\n                          <div style=\"flex:0 0 5px;height:5px;border-radius:50%;background:#0f6e56;margin-top:7px\"><\u002Fdiv>\n                          <div style=\"flex:1;font-size:12.5px;line-height:1.5\">{{ t }}<\u002Fdiv>\n                        <\u002Fdiv>\n                      <\u002Fsc-for>\n                    <\u002Fdiv>\n                    <div style=\"background:#f7f6f2;border-radius:8px;padding:10px 12px;font-size:12px;line-height:1.5;color:#6b7280\"><strong style=\"color:#1c1f23\">Preparation:<\u002Fstrong> {{ p.prep }}<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ hasOptions }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"display:flex;flex-direction:column;gap:10px\">\n              <sc-for list=\"{{ options }}\" as=\"opt\" hint-placeholder-count=\"4\">\n                <button type=\"button\" sc-camel-on-click=\"{{ opt.pick }}\" style=\"{{ opt.style }}\">\n                  <div style=\"display:flex;align-items:flex-start;gap:10px\">\n                    <div style=\"{{ opt.dot }}\"><\u002Fdiv>\n                    <div style=\"flex:1\">\n                      <div style=\"font-size:14.5px;font-weight:600;line-height:1.35\">{{ opt.label }}<\u002Fdiv>\n                      <div style=\"{{ opt.metaStyle }}\">{{ opt.meta }}<\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ isReview }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display:flex;flex-direction:column;gap:10px\">\n              <sc-for list=\"{{ summary }}\" as=\"row\" hint-placeholder-count=\"5\">\n                <div style=\"border:1px solid #dfe0e0;border-radius:10px;padding:12px 14px\">\n                  <div style=\"font-size:11px;font-weight:700;color:#6b7280;letter-spacing:.05em;text-transform:uppercase;margin-bottom:4px\">{{ row.label }}<\u002Fdiv>\n                  <div style=\"font-size:13.5px;line-height:1.5\">{{ row.value }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"background:#f7f6f2;border:1px solid #dfe0e0;border-radius:10px;padding:14px 16px;font-size:12px;line-height:1.6;color:#6b7280;margin-top:14px\">\n              Signing records your consent. Your sample is collected at the site you chose. Your results are reviewed and explained to you by a registered clinician in the Everest clinical team — never by the staff who took your blood.\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ isDone }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"background:#e1f5ee;border:1px solid #b9e3d2;border-radius:12px;padding:20px\">\n              <div style=\"font-size:12px;font-weight:700;color:#0c5c47;letter-spacing:.05em;text-transform:uppercase;margin-bottom:8px\">Appointment confirmed<\u002Fdiv>\n              <div style=\"font-size:15px;line-height:1.6;color:#0c5c47\">{{ doneLine }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:0;margin-top:16px\">\n              <div style=\"display:flex;gap:12px;padding:12px 0;border-bottom:1px solid #dfe0e0\">\n                <div style=\"flex:0 0 76px;font-size:11px;font-weight:700;color:#6b7280;text-transform:uppercase;letter-spacing:.04em\">Now<\u002Fdiv>\n                <div style=\"flex:1;font-size:13px;line-height:1.5\">Confirmation email and patient information leaflet sent. Preparation instructions included.<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:flex;gap:12px;padding:12px 0;border-bottom:1px solid #dfe0e0\">\n                <div style=\"flex:0 0 76px;font-size:11px;font-weight:700;color:#6b7280;text-transform:uppercase;letter-spacing:.04em\">Visit<\u002Fdiv>\n                <div style=\"flex:1;font-size:13px;line-height:1.5\">ID check, consent signed, blood taken. 20 minutes. Sample couriered same day.<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:flex;gap:12px;padding:12px 0;border-bottom:1px solid #dfe0e0\">\n                <div style=\"flex:0 0 76px;font-size:11px;font-weight:700;color:#6b7280;text-transform:uppercase;letter-spacing:.04em\">48–72h<\u002Fdiv>\n                <div style=\"flex:1;font-size:13px;line-height:1.5\">Reviewed by a registered clinician in the Everest clinical team, then released to your portal with a written interpretation.<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:flex;gap:12px;padding:12px 0\">\n                <div style=\"flex:0 0 76px;font-size:11px;font-weight:700;color:#6b7280;text-transform:uppercase;letter-spacing:.04em\">If urgent<\u002Fdiv>\n                <div style=\"flex:1;font-size:13px;line-height:1.5\">A clinician calls you within 1 hour of a critical result and writes to your GP.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <button type=\"button\" sc-camel-on-click=\"{{ restart }}\" style=\"margin-top:20px;width:100%;padding:12px;border-radius:6px;border:1px solid #dfe0e0;background:#fff;color:#102a43;font-size:14px;font-weight:600;cursor:pointer\" style-hover=\"background:#f1f1f1\">Replay the flow<\u002Fbutton>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ showNext }}\" hint-placeholder-val=\"{{ true }}\">\n            <button type=\"button\" sc-camel-on-click=\"{{ next }}\" style=\"{{ nextStyle }}\">{{ nextLabel }}<\u002Fbutton>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ showBack }}\" hint-placeholder-val=\"{{ false }}\">\n            <button type=\"button\" sc-camel-on-click=\"{{ back }}\" style=\"margin-top:10px;width:100%;padding:11px;border-radius:6px;border:1px solid #dfe0e0;background:#fff;color:#102a43;font-size:13.5px;font-weight:600;cursor:pointer\" style-hover=\"background:#f1f1f1\">Back<\u002Fbutton>\n          <\u002Fsc-if>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <sc-if value=\"{{ showNotes }}\" hint-placeholder-val=\"{{ true }}\">\n    <div style=\"flex:1;min-width:300px\">\n      <div style=\"font-size:11px;font-weight:700;color:#6b7280;letter-spacing:.06em;text-transform:uppercase;margin-bottom:10px\">Design notes — this step<\u002Fdiv>\n      <div style=\"background:#fff;border:1px solid #dfe0e0;border-radius:12px;padding:20px 22px;margin-bottom:18px\">\n        <div style=\"font-size:16px;font-weight:600;margin-bottom:10px\">{{ noteTitle }}<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:10px\">\n          <sc-for list=\"{{ notes }}\" as=\"n\" hint-placeholder-count=\"3\">\n            <div style=\"display:flex;gap:10px;align-items:flex-start\">\n              <div style=\"flex:0 0 6px;height:6px;border-radius:50%;background:#0f6e56;margin-top:7px\"><\u002Fdiv>\n              <div style=\"flex:1;font-size:13.5px;line-height:1.6;color:#1c1f23\">{{ n }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"background:#fff;border:1px solid #dfe0e0;border-radius:12px;padding:20px 22px\">\n        <div style=\"font-size:16px;font-weight:600;margin-bottom:4px\">Screening logic<\u002Fdiv>\n        <div style=\"font-size:12.5px;color:#6b7280;line-height:1.55;margin-bottom:16px\">Three gates sit between booking and a needle. Every gate is non-clinical: the questionnaire never interprets, it only routes.<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:12px\">\n          <div style=\"border-left:3px solid #a32d2d;padding-left:12px\">\n            <div style=\"font-size:13.5px;font-weight:600;margin-bottom:2px\">Gate 1 — Red flag hard stop<\u002Fdiv>\n            <div style=\"font-size:12.5px;color:#6b7280;line-height:1.55\">Any red-flag symptom ends the booking, shows 999/GP signposting, and writes the symptom set, advice given, timestamp and staff/system ID to the screening record.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"border-left:3px solid #7a5400;padding-left:12px\">\n            <div style=\"font-size:13.5px;font-weight:600;margin-bottom:2px\">Gate 2 — Exclusion &amp; review<\u002Fdiv>\n            <div style=\"font-size:12.5px;color:#6b7280;line-height:1.55\">Bleeding disorders, anticoagulation, known BBV, incapacity and severe needle phobia route to exclusion or to clinician pre-review before a slot is released.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"border-left:3px solid #0f6e56;padding-left:12px\">\n            <div style=\"font-size:13.5px;font-weight:600;margin-bottom:2px\">Gate 3 — Sample validity<\u002Fdiv>\n            <div style=\"font-size:12.5px;color:#6b7280;line-height:1.55\">Panel-specific prep (fasting, 08:00–09:00 cortisol, day-21 progesterone) constrains which slots the patient can even see, so samples are not rejected later.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isResults }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"max-width:1180px;margin:0 auto;padding:28px 24px 80px\">\n    <div style=\"margin-bottom:22px\">\n      <div style=\"font-size:24px;font-weight:600;margin-bottom:6px\">Patient results — what they receive<\u002Fdiv>\n      <div style=\"font-size:14px;color:#6b7280;line-height:1.6;max-width:780px\">Stage 7 of the workflow. A clinician has reviewed and signed this before it exists — nothing here is generated automatically. Deliberately organised as a <strong>plan<\u002Fstrong>, not a score: patients act on instructions, not on a number out of 100. Worked example: General Health Screen with two abnormal results.<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;gap:24px;align-items:flex-start;flex-wrap:wrap\">\n    <div style=\"flex:1;min-width:340px;background:#fff;border:1px solid #dfe0e0;border-radius:14px;overflow:hidden\">\n\n      <div style=\"background:#102a43;padding:24px 28px;display:flex;justify-content:space-between;align-items:flex-start;gap:18px;flex-wrap:wrap\">\n        <div>\n          <div style=\"font-size:11px;font-weight:700;color:#7fd3b4;letter-spacing:.06em;text-transform:uppercase;margin-bottom:7px\">Your results are ready<\u002Fdiv>\n          <div style=\"font-size:20px;font-weight:600;color:#fff;line-height:1.3\">General Health Screen<\u002Fdiv>\n          <div style=\"font-size:13px;color:#b9c6d4;margin-top:4px\">Sample taken Thursday 17 September, Whalley Range<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"text-align:right\">\n          <div style=\"font-size:12px;color:#b9c6d4;line-height:1.5\">Reviewed and signed by<\u002Fdiv>\n          <div style=\"font-size:14px;font-weight:600;color:#fff;line-height:1.5\">Dr [name] · GMC [number]<\u002Fdiv>\n          <div style=\"font-size:12px;color:#b9c6d4;line-height:1.5\">Everest clinical team · 19 Sept, 08:40<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"background:#e1f5ee;border-bottom:1px solid #b9e3d2;padding:24px 28px;display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap\">\n        <div style=\"flex:0 0 auto;width:46px;height:46px;border-radius:50%;background:#0f6e56;color:#fff;display:flex;align-items:center;justify-content:center;font-size:23px;font-weight:700\">✓<\u002Fdiv>\n        <div style=\"flex:1;min-width:240px\">\n          <div style=\"font-size:19px;font-weight:600;color:#0c5c47;line-height:1.35;margin-bottom:8px\">Most of your results are normal. Two need attention, and neither is urgent.<\u002Fdiv>\n          <div style=\"font-size:14px;line-height:1.6;color:#0c5c47\">Your iron stores are low and your cholesterol is above the recommended range. Your blood count, kidneys, liver, thyroid and blood sugar are all within normal limits. There is a plan for both below.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"padding:24px 28px;border-bottom:1px solid #dfe0e0\">\n        <div style=\"font-size:11px;font-weight:700;color:#6b7280;letter-spacing:.05em;text-transform:uppercase;margin-bottom:14px\">What to do next<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:11px\">\n          <div style=\"display:flex;gap:13px;align-items:flex-start;border:1px solid #f0c36d;background:#fff7e6;border-radius:10px;padding:15px 17px\">\n            <div style=\"flex:0 0 26px;height:26px;border-radius:50%;background:#7a5400;color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700\">1<\u002Fdiv>\n            <div style=\"flex:1\">\n              <div style=\"font-size:15px;font-weight:600;color:#7a5400;margin-bottom:4px\">Book a GP appointment within two weeks<\u002Fdiv>\n              <div style=\"font-size:13.5px;line-height:1.6;color:#7a5400\">Low iron stores need a cause found, not just iron tablets. We have already written to your GP with these results, so you will not have to explain them. Mention low ferritin when you book.<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;gap:13px;align-items:flex-start;border:1px solid #dfe0e0;border-radius:10px;padding:15px 17px\">\n            <div style=\"flex:0 0 26px;height:26px;border-radius:50%;background:#102a43;color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700\">2<\u002Fdiv>\n            <div style=\"flex:1\">\n              <div style=\"font-size:15px;font-weight:600;margin-bottom:4px\">Raise your cholesterol at the same appointment<\u002Fdiv>\n              <div style=\"font-size:13.5px;line-height:1.6;color:#6b7280\">Your LDL is mildly raised. With no other risk factors this is usually managed with diet and activity first. Your GP can calculate your ten-year cardiovascular risk, which a blood test alone cannot give.<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;gap:13px;align-items:flex-start;border:1px solid #dfe0e0;border-radius:10px;padding:15px 17px\">\n            <div style=\"flex:0 0 26px;height:26px;border-radius:50%;background:#102a43;color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700\">3<\u002Fdiv>\n            <div style=\"flex:1\">\n              <div style=\"font-size:15px;font-weight:600;margin-bottom:4px\">Repeat ferritin and lipids in three months<\u002Fdiv>\n              <div style=\"font-size:13.5px;line-height:1.6;color:#6b7280\">Long enough for treatment or lifestyle changes to show. We will remind you — you do not need to diarise it.<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"padding:24px 28px;border-bottom:1px solid #dfe0e0\">\n        <div style=\"display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:10px;margin-bottom:6px\">\n          <div style=\"font-size:11px;font-weight:700;color:#6b7280;letter-spacing:.05em;text-transform:uppercase\">Needs attention<\u002Fdiv>\n          <div style=\"font-size:12px;color:#6b7280\">2 of 18 results<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-size:12.5px;color:#6b7280;line-height:1.55;margin-bottom:16px\">Each one says what was measured, what your number means, and why it matters — in that order.<\u002Fdiv>\n\n        <div style=\"border:1px solid #f0c36d;border-radius:12px;overflow:hidden;margin-bottom:12px\">\n          <div style=\"background:#fff7e6;padding:15px 18px;display:flex;justify-content:space-between;align-items:baseline;gap:14px;flex-wrap:wrap\">\n            <div>\n              <div style=\"font-size:16px;font-weight:600;color:#7a5400\">Ferritin — your iron stores<\u002Fdiv>\n              <div style=\"font-size:12.5px;color:#7a5400;margin-top:2px\">Low · normal range 30–300 µg/L<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"font-size:28px;font-weight:700;color:#7a5400;font-family:ui-monospace,monospace\">8<span style=\"font-size:15px;font-weight:600\"> µg/L<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"padding:16px 18px\">\n            <div style=\"height:8px;border-radius:5px;background:linear-gradient(to right,#f0c36d 0%,#f0c36d 16%,#b9e3d2 16%,#b9e3d2 88%,#f0c36d 88%);position:relative;margin-bottom:8px\">\n              <div style=\"position:absolute;left:3%;top:-4px;width:4px;height:16px;border-radius:2px;background:#7a5400\"><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex;justify-content:space-between;font-size:11px;color:#6b7280;margin-bottom:14px\"><span>0<\u002Fspan><span>30 — normal range — 300<\u002Fspan><span>400<\u002Fspan><\u002Fdiv>\n            <div style=\"font-size:13.5px;line-height:1.65\">Ferritin is the protein that stores iron in your body. At 8 µg/L your stores are substantially depleted, which is a common cause of tiredness, breathlessness on stairs and poor concentration — often before anaemia shows up on a blood count. Yours has not yet affected your haemoglobin, which is reassuring.<\u002Fdiv>\n            <div style=\"font-size:13.5px;line-height:1.65;margin-top:10px;color:#6b7280\"><strong style=\"color:#1c1f23\">Why the GP referral:<\u002Fstrong> iron deficiency is a finding, not a diagnosis. In adults the important question is where the iron is going — most commonly diet, heavy periods, or slow blood loss from the gut. That question needs a GP who knows your history, which is why we have written to them rather than simply recommending a supplement.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"border:1px solid #f0c36d;border-radius:12px;overflow:hidden\">\n          <div style=\"background:#fff7e6;padding:15px 18px;display:flex;justify-content:space-between;align-items:baseline;gap:14px;flex-wrap:wrap\">\n            <div>\n              <div style=\"font-size:16px;font-weight:600;color:#7a5400\">LDL cholesterol — the artery-clogging kind<\u002Fdiv>\n              <div style=\"font-size:12.5px;color:#7a5400;margin-top:2px\">Mildly raised · target below 3.0 mmol/L<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"font-size:28px;font-weight:700;color:#7a5400;font-family:ui-monospace,monospace\">4.1<span style=\"font-size:15px;font-weight:600\"> mmol/L<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"padding:16px 18px\">\n            <div style=\"height:8px;border-radius:5px;background:linear-gradient(to right,#b9e3d2 0%,#b9e3d2 60%,#f0c36d 60%,#f0c36d 84%,#f0cdcd 84%);position:relative;margin-bottom:8px\">\n              <div style=\"position:absolute;left:78%;top:-4px;width:4px;height:16px;border-radius:2px;background:#7a5400\"><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex;justify-content:space-between;font-size:11px;color:#6b7280;margin-bottom:14px\"><span>0<\u002Fspan><span>3.0 — target<\u002Fspan><span>5.0+<\u002Fspan><\u002Fdiv>\n            <div style=\"font-size:13.5px;line-height:1.65\">LDL carries cholesterol into artery walls, where over years it contributes to narrowing. Your total cholesterol is 5.8 and your HDL — the protective kind — is 1.4, which is healthy. So the picture is a mild single-marker rise rather than a poor overall lipid profile.<\u002Fdiv>\n            <div style=\"font-size:13.5px;line-height:1.65;margin-top:10px;color:#6b7280\"><strong style=\"color:#1c1f23\">What this does not mean:<\u002Fstrong> one raised LDL is not a heart-disease diagnosis and does not by itself mean you need a statin. Risk is calculated from age, blood pressure, smoking, family history and these numbers together — a conversation for your GP, not a number on a screen.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"padding:24px 28px;border-bottom:1px solid #dfe0e0\">\n        <div style=\"display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:10px;margin-bottom:14px\">\n          <div style=\"font-size:11px;font-weight:700;color:#6b7280;letter-spacing:.05em;text-transform:uppercase\">Normal results<\u002Fdiv>\n          <div style=\"font-size:12px;color:#6b7280\">16 of 18 · full numbers in your downloadable report<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:10px\">\n          <div style=\"border:1px solid #b9e3d2;background:#e1f5ee;border-radius:10px;padding:13px 15px\"><div style=\"font-size:13.5px;font-weight:600;color:#0c5c47;margin-bottom:3px\">Blood count<\u002Fdiv><div style=\"font-size:12.5px;line-height:1.5;color:#0c5c47\">Hb 134 g/L · no anaemia, normal white cells and platelets<\u002Fdiv><\u002Fdiv>\n          <div style=\"border:1px solid #b9e3d2;background:#e1f5ee;border-radius:10px;padding:13px 15px\"><div style=\"font-size:13.5px;font-weight:600;color:#0c5c47;margin-bottom:3px\">Kidneys<\u002Fdiv><div style=\"font-size:12.5px;line-height:1.5;color:#0c5c47\">eGFR above 90 · filtering normally, salts balanced<\u002Fdiv><\u002Fdiv>\n          <div style=\"border:1px solid #b9e3d2;background:#e1f5ee;border-radius:10px;padding:13px 15px\"><div style=\"font-size:13.5px;font-weight:600;color:#0c5c47;margin-bottom:3px\">Liver<\u002Fdiv><div style=\"font-size:12.5px;line-height:1.5;color:#0c5c47\">ALT 22 · all enzymes within range<\u002Fdiv><\u002Fdiv>\n          <div style=\"border:1px solid #b9e3d2;background:#e1f5ee;border-radius:10px;padding:13px 15px\"><div style=\"font-size:13.5px;font-weight:600;color:#0c5c47;margin-bottom:3px\">Thyroid<\u002Fdiv><div style=\"font-size:12.5px;line-height:1.5;color:#0c5c47\">TSH 2.1 · not the cause of your tiredness<\u002Fdiv><\u002Fdiv>\n          <div style=\"border:1px solid #b9e3d2;background:#e1f5ee;border-radius:10px;padding:13px 15px\"><div style=\"font-size:13.5px;font-weight:600;color:#0c5c47;margin-bottom:3px\">Blood sugar<\u002Fdiv><div style=\"font-size:12.5px;line-height:1.5;color:#0c5c47\">HbA1c 34 mmol/mol · well below the pre-diabetes range<\u002Fdiv><\u002Fdiv>\n          <div style=\"border:1px solid #b9e3d2;background:#e1f5ee;border-radius:10px;padding:13px 15px\"><div style=\"font-size:13.5px;font-weight:600;color:#0c5c47;margin-bottom:3px\">Inflammation<\u002Fdiv><div style=\"font-size:12.5px;line-height:1.5;color:#0c5c47\">CRP under 3 · no sign of active inflammation or infection<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"padding:24px 28px;display:flex;gap:20px;flex-wrap:wrap;align-items:flex-start\">\n        <div style=\"flex:1;min-width:250px\">\n          <div style=\"font-size:11px;font-weight:700;color:#6b7280;letter-spacing:.05em;text-transform:uppercase;margin-bottom:10px\">If things change<\u002Fdiv>\n          <div style=\"font-size:13.5px;line-height:1.65\">Contact your GP sooner if you become much more tired, breathless at rest, or notice blood in your stool or very dark stools. Call 999 for chest pain or severe breathlessness. These results describe one moment in time — new symptoms always need a fresh assessment.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"flex:0 0 260px;min-width:220px;display:flex;flex-direction:column;gap:9px\">\n          <button type=\"button\" style=\"width:100%;padding:12px;border-radius:6px;border:none;background:#0f6e56;color:#fff;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit\">Talk to a clinician<\u002Fbutton>\n          <button type=\"button\" style=\"width:100%;padding:12px;border-radius:6px;border:1px solid #dfe0e0;background:#fff;color:#102a43;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit\" style-hover=\"background:#f1f1f1\">Download full report (PDF)<\u002Fbutton>\n          <button type=\"button\" style=\"width:100%;padding:12px;border-radius:6px;border:1px solid #dfe0e0;background:#fff;color:#102a43;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit\" style-hover=\"background:#f1f1f1\">Book my repeat test<\u002Fbutton>\n          <div style=\"font-size:11.5px;line-height:1.55;color:#6b7280;margin-top:3px\">A copy has been sent to your GP practice. The pharmacy that took your blood cannot see these results.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"flex:0 0 300px;min-width:260px;display:flex;flex-direction:column;gap:14px\">\n      <div style=\"background:#fff;border:1px solid #dfe0e0;border-radius:12px;padding:18px 20px\">\n        <div style=\"font-size:15px;font-weight:600;margin-bottom:10px\">Why no health score<\u002Fdiv>\n        <div style=\"font-size:13px;line-height:1.6;color:#6b7280\">A single number out of 100 is engaging and clinically meaningless — it implies a precision blood tests do not have, and it invites patients to chase the number rather than act on the finding. It also has no defensible basis in the clinical record when a result is later disputed. The plan carries the same motivation and survives scrutiny.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#fff;border:1px solid #dfe0e0;border-radius:12px;padding:18px 20px\">\n        <div style=\"font-size:15px;font-weight:600;margin-bottom:10px\">Reading order<\u002Fdiv>\n        <div style=\"font-size:13px;line-height:1.6;color:#6b7280\">Verdict, then actions, then abnormals, then normals. Most patients want to know whether they are alright and what to do — in that order. Numbers are available but never lead, because an unexplained figure generates anxious calls the service then has to absorb.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#fff;border:1px solid #dfe0e0;border-radius:12px;padding:18px 20px\">\n        <div style=\"font-size:15px;font-weight:600;margin-bottom:10px\">Plain but not vague<\u002Fdiv>\n        <div style=\"font-size:13px;line-height:1.6;color:#6b7280\">Every abnormal explains the mechanism (“ferritin stores iron”), the interpretation, and explicitly what it does <em>not<\u002Fem> mean. Naming the boundary — a raised LDL is not a heart-disease diagnosis — prevents both false alarm and false reassurance, and is what a clinician would say aloud.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#f2edfa;border:1px solid #d5c7ee;border-radius:12px;padding:18px 20px\">\n        <div style=\"font-size:15px;font-weight:600;color:#4a2f78;margin-bottom:10px\">Critical results never arrive this way<\u002Fdiv>\n        <div style=\"font-size:13px;line-height:1.6;color:#4a2f78\">A critical value triggers a clinician phone call within one hour. Nobody learns something dangerous by opening a portal — the portal entry appears only after the conversation has happened.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isJourney }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"max-width:1400px;margin:0 auto;padding:28px 24px 80px\">\n    <div class=\"noprint\" style=\"margin-bottom:24px\">\n      <div style=\"font-size:24px;font-weight:600;margin-bottom:6px\">Patient journey guide — for staff<\u002Fdiv>\n      <div style=\"font-size:14px;color:#6b7280;line-height:1.6;max-width:760px\">The appointment from the patient's arrival to the courier bag, written as what you do, what you say and what you record. Then the full catalogue of what can be ordered. Print both halves for the clinical room.<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap;margin-bottom:34px\">\n      <div style=\"flex:1;min-width:320px;display:flex;flex-direction:column;gap:14px\">\n\n        <div style=\"background:#fff;border:1px solid #dfe0e0;border-radius:12px;padding:20px 22px\">\n          <div style=\"display:flex;gap:14px;align-items:baseline;margin-bottom:12px\">\n            <div style=\"flex:0 0 auto;width:28px;height:28px;border-radius:6px;background:#102a43;color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700\">1<\u002Fdiv>\n            <div><div style=\"font-size:17px;font-weight:600\">Before they arrive<\u002Fdiv><div style=\"font-size:12.5px;color:#6b7280\">Five minutes at the start of the session<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:8px;font-size:13.5px;line-height:1.55\">\n            <div><strong>Do:<\u002Fstrong> open today's list. Check fridge temperature and log it. Check the emergency kit seal and adrenaline expiry. Confirm the courier cut-off and count backwards to your last bookable slot.<\u002Fdiv>\n            <div><strong>Check:<\u002Fstrong> any booking flagged <em>clinically reviewed — proceed<\u002Fem> carries a note. Read it before the patient sits down, not while they are in the chair.<\u002Fdiv>\n            <div><strong>Record:<\u002Fstrong> fridge temp, kit check, staff on duty and competency status.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"background:#fff;border:1px solid #dfe0e0;border-radius:12px;padding:20px 22px\">\n          <div style=\"display:flex;gap:14px;align-items:baseline;margin-bottom:12px\">\n            <div style=\"flex:0 0 auto;width:28px;height:28px;border-radius:6px;background:#102a43;color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700\">2<\u002Fdiv>\n            <div><div style=\"font-size:17px;font-weight:600\">Arrival and identity<\u002Fdiv><div style=\"font-size:12.5px;color:#6b7280\">Two minutes · the appointment cannot proceed without this<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:8px;font-size:13.5px;line-height:1.55\">\n            <div><strong>Do:<\u002Fstrong> confirm name, date of birth and address against the booking. Ask for photo ID. Check the patient booked for themselves — the test is not transferable.<\u002Fdiv>\n            <div><strong>Say:<\u002Fstrong> “Can I take your full name, date of birth and first line of your address?” Open-ended, never “are you Mr Nasir?”<\u002Fdiv>\n            <div><strong>Stop if:<\u002Fstrong> the details do not match, or someone else has come in their place. Rebook. A sample taken from the wrong person is a medical data breach, not an admin error.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"background:#fff;border:1px solid #f0cdcd;border-radius:12px;padding:20px 22px\">\n          <div style=\"display:flex;gap:14px;align-items:baseline;margin-bottom:12px\">\n            <div style=\"flex:0 0 auto;width:28px;height:28px;border-radius:6px;background:#a32d2d;color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700\">3<\u002Fdiv>\n            <div><div style=\"font-size:17px;font-weight:600\">Face-to-face eligibility re-check<\u002Fdiv><div style=\"font-size:12.5px;color:#a32d2d\">The online answers are a screen, not a clearance<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:8px;font-size:13.5px;line-height:1.55\">\n            <div><strong>Ask:<\u002Fstrong> “Since you booked, has anything changed — have you been unwell, had chest pain, breathlessness, or fainted?”<\u002Fdiv>\n            <div><strong>Stop if:<\u002Fstrong> any red flag is present today. Do not take blood. Advise same-day GP contact, or 999 if life-threatening. Record the symptoms, the advice you gave, the time and your name.<\u002Fdiv>\n            <div><strong>Also ask:<\u002Fstrong> whether they have eaten (if fasting is required), and whether they have taken anticoagulants — this changes how long you hold pressure, not whether you proceed.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"background:#fff;border:1px solid #dfe0e0;border-radius:12px;padding:20px 22px\">\n          <div style=\"display:flex;gap:14px;align-items:baseline;margin-bottom:12px\">\n            <div style=\"flex:0 0 auto;width:28px;height:28px;border-radius:6px;background:#102a43;color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700\">4<\u002Fdiv>\n            <div><div style=\"font-size:17px;font-weight:600\">Consent<\u002Fdiv><div style=\"font-size:12.5px;color:#6b7280\">Signed, witnessed, copy offered<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:8px;font-size:13.5px;line-height:1.55\">\n            <div><strong>Cover all four:<\u002Fstrong> what the test involves; which panel and what it measures; that a registered clinician in the Everest clinical team reviews the results and contacts them; how their data is shared with the laboratory.<\u002Fdiv>\n            <div><strong>Say:<\u002Fstrong> “Results come from our clinical team, not from me — they'll call or message you within two to three days and explain what everything means.”<\u002Fdiv>\n            <div><strong>Stop if:<\u002Fstrong> they cannot consent for themselves, or capacity is in doubt. Escalate to the Responsible Pharmacist. Do not proceed on a relative's word.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"background:#fff;border:1px solid #dfe0e0;border-radius:12px;padding:20px 22px\">\n          <div style=\"display:flex;gap:14px;align-items:baseline;margin-bottom:12px\">\n            <div style=\"flex:0 0 auto;width:28px;height:28px;border-radius:6px;background:#102a43;color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700\">5<\u002Fdiv>\n            <div><div style=\"font-size:17px;font-weight:600\">Venepuncture<\u002Fdiv><div style=\"font-size:12.5px;color:#6b7280\">Maximum two attempts, then stop<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:8px;font-size:13.5px;line-height:1.55\">\n            <div><strong>Do:<\u002Fstrong> patient seated or reclined, never standing. Check the tube list on the worksheet against the panel before you start. Tourniquet under a minute. Draw order per the laboratory's SOP.<\u002Fdiv>\n            <div><strong>Label at the chair<\u002Fstrong> — patient still present, before you leave the room. Never pre-label, never label at the bench.<\u002Fdiv>\n            <div><strong>Stop if:<\u002Fstrong> two attempts have failed, or the patient asks you to stop. Rebook, apologise, record the attempts. A third attempt is not permitted.<\u002Fdiv>\n            <div><strong>Watch for:<\u002Fstrong> pallor, sweating, yawning — early vasovagal. Stop, lie them flat, raise the legs.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"background:#fff;border:1px solid #dfe0e0;border-radius:12px;padding:20px 22px\">\n          <div style=\"display:flex;gap:14px;align-items:baseline;margin-bottom:12px\">\n            <div style=\"flex:0 0 auto;width:28px;height:28px;border-radius:6px;background:#102a43;color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700\">6<\u002Fdiv>\n            <div><div style=\"font-size:17px;font-weight:600\">Aftercare and leaving<\u002Fdiv><div style=\"font-size:12.5px;color:#6b7280\">Do not let them walk straight out<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:8px;font-size:13.5px;line-height:1.55\">\n            <div><strong>Do:<\u002Fstrong> pressure until bleeding stops, dressing, aftercare leaflet. Sit them for a few minutes. Longer if they are on anticoagulants or felt faint.<\u002Fdiv>\n            <div><strong>Say:<\u002Fstrong> what to do about a bruise, when to seek advice, and when results arrive. Nothing about what the results might show.<\u002Fdiv>\n            <div><strong>Record:<\u002Fstrong> aftercare given, observation time, any complication — however minor.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"background:#fff;border:1px solid #dfe0e0;border-radius:12px;padding:20px 22px\">\n          <div style=\"display:flex;gap:14px;align-items:baseline;margin-bottom:12px\">\n            <div style=\"flex:0 0 auto;width:28px;height:28px;border-radius:6px;background:#102a43;color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700\">7<\u002Fdiv>\n            <div><div style=\"font-size:17px;font-weight:600\">Sample to courier<\u002Fdiv><div style=\"font-size:12.5px;color:#6b7280\">Four scans: label, fridge, bag, lab receipt<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:8px;font-size:13.5px;line-height:1.55\">\n            <div><strong>Do:<\u002Fstrong> scan into the fridge at 2–8°C. Any tube needing rapid processing (homocysteine) goes on the priority run. UN3373 packaging. Courier signs the chain-of-custody record.<\u002Fdiv>\n            <div><strong>Stop if:<\u002Fstrong> a barcode does not match the request. Quarantine, label “DO NOT USE — ERROR”, and follow the sample error flowchart. Never “best guess” a label.<\u002Fdiv>\n            <div><strong>Then:<\u002Fstrong> the appointment is closed in the console. Your part is finished — the result does not come back to you.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"flex:0 0 320px;min-width:280px;display:flex;flex-direction:column;gap:14px\">\n        <div style=\"background:#fcebeb;border:1px solid #f0cdcd;border-radius:12px;padding:18px 20px\">\n          <div style=\"font-size:12px;font-weight:700;color:#a32d2d;text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px\">Four things that end an appointment<\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:7px;font-size:13px;line-height:1.5;color:#7c2626\">\n            <div>A red flag symptom today<\u002Fdiv>\n            <div>Identity or booking mismatch<\u002Fdiv>\n            <div>Consent or capacity in doubt<\u002Fdiv>\n            <div>Two failed attempts<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font-size:12px;line-height:1.55;color:#a32d2d;margin-top:12px\">Each one is recorded and rebooked. None of them is a judgement call you make alone — escalate to the RP.<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"background:#fff;border:1px solid #dfe0e0;border-radius:12px;padding:18px 20px\">\n          <div style=\"font-size:12px;font-weight:700;color:#6b7280;text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px\">Tube colours at a glance<\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:9px;font-size:12.5px;line-height:1.45\">\n            <div style=\"display:flex;gap:10px;align-items:center\"><span style=\"flex:0 0 14px;height:14px;border-radius:3px;background:#6b3fa0;border:1px solid #4e2d78\"><\u002Fspan><div><strong>EDTA (purple)<\u002Fstrong> — FBC, HbA1c, homocysteine<\u002Fdiv><\u002Fdiv>\n            <div style=\"display:flex;gap:10px;align-items:center\"><span style=\"flex:0 0 14px;height:14px;border-radius:3px;background:#d8b53f;border:1px solid #a8892c\"><\u002Fspan><div><strong>Serum<\u002Fstrong> — most chemistry, hormones, antibodies<\u002Fdiv><\u002Fdiv>\n            <div style=\"display:flex;gap:10px;align-items:center\"><span style=\"flex:0 0 14px;height:14px;border-radius:3px;background:#9aa0a6;border:1px solid #6b7280\"><\u002Fspan><div><strong>Fluoride oxalate (grey)<\u002Fstrong> — fasting glucose<\u002Fdiv><\u002Fdiv>\n            <div style=\"display:flex;gap:10px;align-items:center\"><span style=\"flex:0 0 14px;height:14px;border-radius:3px;background:#2f6fb5;border:1px solid #235287\"><\u002Fspan><div><strong>Citrate (light blue)<\u002Fstrong> — PT/INR, fill exactly to the line<\u002Fdiv><\u002Fdiv>\n            <div style=\"display:flex;gap:10px;align-items:center\"><span style=\"flex:0 0 14px;height:14px;border-radius:3px;background:#1b3c8c;border:1px solid #142c66\"><\u002Fspan><div><strong>Royal blue<\u002Fstrong> — zinc, selenium, copper<\u002Fdiv><\u002Fdiv>\n            <div style=\"display:flex;gap:10px;align-items:center\"><span style=\"flex:0 0 14px;height:14px;border-radius:3px;background:#f0c36d;border:1px solid #c79b3c\"><\u002Fspan><div><strong>Urine pot<\u002Fstrong> — ACR<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font-size:11.5px;line-height:1.5;color:#6b7280;margin-top:12px\">Indicative only. The laboratory's own tube guide and draw order take precedence — check the worksheet for every panel.<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"background:#fff;border:1px solid #dfe0e0;border-radius:12px;padding:18px 20px\">\n          <div style=\"font-size:12px;font-weight:700;color:#6b7280;text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px\">Timing rules worth knowing by heart<\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:9px;font-size:12.5px;line-height:1.5\">\n            <div><strong>Fasting<\u002Fstrong> 8–10 hours, water only — fasting glucose only. HbA1c and lipids do not need it.<\u002Fdiv>\n            <div><strong>Cortisol<\u002Fstrong> 08:00–09:00. A 14:00 sample is an unusable sample.<\u002Fdiv>\n            <div><strong>Progesterone<\u002Fstrong> day 21 of a 28-day cycle. Ask, do not assume.<\u002Fdiv>\n            <div><strong>Testosterone<\u002Fstrong> morning draw where the request specifies it.<\u002Fdiv>\n            <div><strong>Homocysteine<\u002Fstrong> needs rapid processing — priority courier run only.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"noprint\" style=\"display:flex;align-items:center;gap:14px;margin-bottom:16px;flex-wrap:wrap\">\n      <div style=\"font-size:11px;font-weight:700;color:#6b7280;text-transform:uppercase;letter-spacing:.06em\">What can be ordered<\u002Fdiv>\n      <div style=\"flex:1;height:1px;background:#dfe0e0;min-width:40px\"><\u002Fdiv>\n      <div style=\"font-size:12px;color:#6b7280\">16 panels · Core, Targeted and Specialist tests<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"background:#fff;border:1px solid #dfe0e0;border-radius:12px;padding:20px 22px;margin-bottom:18px\">\n      <div style=\"font-size:13px;line-height:1.6;color:#6b7280\">Every panel goes to the same UKAS ISO 15189 laboratory. <strong style=\"color:#1c1f23\">Core<\u002Fstrong> is included in the panel price. <strong style=\"color:#1c1f23\">Targeted<\u002Fstrong> is added when the request or the patient's history calls for it. <strong style=\"color:#1c1f23\">Specialist<\u002Fstrong> is pathway-led only — it needs a clinical reason on the request, and a clinician at Everest signs it off before the lab is asked for it.<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px\">\n\n      <div style=\"background:#fff;border:1px solid #dfe0e0;border-radius:12px;padding:20px 22px\">\n        <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:12px\"><div style=\"font-size:16px;font-weight:600\">1 · General Health Screen<\u002Fdiv><span style=\"font-size:11px;font-weight:700;padding:3px 10px;border-radius:100px;background:#e1f5ee;color:#0f6e56\">No fasting<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:7px;font-size:13px;line-height:1.5\">\n          <div><strong>FBC<\u002Fstrong> — Hb, WBC, platelets, indices · EDTA purple · Core<\u002Fdiv>\n          <div><strong>U&amp;E<\u002Fstrong> — Na, K, urea, creatinine, eGFR · serum · Core<\u002Fdiv>\n          <div><strong>LFTs<\u002Fstrong> — ALT, AST, ALP, GGT, albumin, bilirubin · serum · Core<\u002Fdiv>\n          <div><strong>Thyroid<\u002Fstrong> — TSH, FT4 if indicated · serum · Core<\u002Fdiv>\n          <div><strong>HbA1c<\u002Fstrong> — glycaemic control · EDTA purple · Core<\u002Fdiv>\n          <div><strong>CRP<\u002Fstrong> — inflammation · serum · Core<\u002Fdiv>\n          <div><strong>Ferritin &amp; iron studies<\u002Fstrong> — iron, TIBC, transferrin sat. · serum · Targeted<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"background:#fff;border:1px solid #dfe0e0;border-radius:12px;padding:20px 22px\">\n        <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:12px\"><div style=\"font-size:16px;font-weight:600\">2 · Diabetes Monitoring<\u002Fdiv><span style=\"font-size:11px;font-weight:700;padding:3px 10px;border-radius:100px;background:#fff7e6;color:#7a5400\">Fasting if glucose added<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:7px;font-size:13px;line-height:1.5\">\n          <div><strong>HbA1c<\u002Fstrong> — long-term glycaemia, no fasting · EDTA purple · Core<\u002Fdiv>\n          <div><strong>Fasting plasma glucose<\u002Fstrong> — 8–10 hour fast · fluoride oxalate grey · Targeted<\u002Fdiv>\n          <div><strong>U&amp;E / renal function<\u002Fstrong> — kidney monitoring · serum · Core<\u002Fdiv>\n          <div><strong>Lipid profile<\u002Fstrong> — CV risk, usually non-fasting · serum · Targeted<\u002Fdiv>\n          <div><strong>Urine ACR<\u002Fstrong> — albuminuria · urine pot, patient-provided · Core<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"background:#fff;border:1px solid #dfe0e0;border-radius:12px;padding:20px 22px\">\n        <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:12px\"><div style=\"font-size:16px;font-weight:600\">3 · Thyroid Function<\u002Fdiv><span style=\"font-size:11px;font-weight:700;padding:3px 10px;border-radius:100px;background:#e1f5ee;color:#0f6e56\">No fasting<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:7px;font-size:13px;line-height:1.5\">\n          <div><strong>TSH<\u002Fstrong> — thyroid stimulating hormone · serum · Core<\u002Fdiv>\n          <div><strong>Free T4<\u002Fstrong> — reflexed or added if indicated · serum · Targeted<\u002Fdiv>\n          <div><strong>Free T3<\u002Fstrong> — only if specifically indicated · serum · Specialist<\u002Fdiv>\n          <div><strong>Thyroid antibodies<\u002Fstrong> — anti-TPO, anti-TG · serum · Specialist<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"background:#fff;border:1px solid #dfe0e0;border-radius:12px;padding:20px 22px\">\n        <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:12px\"><div style=\"font-size:16px;font-weight:600\">4 · Cardiovascular Risk<\u002Fdiv><span style=\"font-size:11px;font-weight:700;padding:3px 10px;border-radius:100px;background:#e1f5ee;color:#0f6e56\">Non-fasting<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:7px;font-size:13px;line-height:1.5\">\n          <div><strong>Lipid profile<\u002Fstrong> — total cholesterol, LDL, HDL, TG, non-HDL · serum · Core<\u002Fdiv>\n          <div><strong>ApoB<\u002Fstrong> — atherogenic particle burden · serum · Targeted<\u002Fdiv>\n          <div><strong>Lp(a)<\u002Fstrong> — inherited risk, usually once in a lifetime · serum · Specialist<\u002Fdiv>\n          <div><strong>hsCRP<\u002Fstrong> — inflammatory CV marker, pathway-led · serum · Specialist<\u002Fdiv>\n          <div><strong>HbA1c<\u002Fstrong> — metabolic risk · EDTA purple · Core<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"background:#fff;border:1px solid #dfe0e0;border-radius:12px;padding:20px 22px\">\n        <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:12px\"><div style=\"font-size:16px;font-weight:600\">5 · Liver Health<\u002Fdiv><span style=\"font-size:11px;font-weight:700;padding:3px 10px;border-radius:100px;background:#e1f5ee;color:#0f6e56\">No fasting<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:7px;font-size:13px;line-height:1.5\">\n          <div><strong>LFTs<\u002Fstrong> — ALT, AST, ALP, GGT, albumin, bilirubin · serum · Core<\u002Fdiv>\n          <div><strong>Ferritin<\u002Fstrong> — iron stores, NAFLD, haemochromatosis · serum · Targeted<\u002Fdiv>\n          <div><strong>PT/INR<\u002Fstrong> — synthetic function · citrate blue, fill to the line · Specialist<\u002Fdiv>\n          <div><strong>HBsAg<\u002Fstrong> — hepatitis B screen · serum · Targeted<\u002Fdiv>\n          <div><strong>Anti-HCV<\u002Fstrong> — hepatitis C screen · serum · Targeted<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"background:#fff;border:1px solid #dfe0e0;border-radius:12px;padding:20px 22px\">\n        <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:12px\"><div style=\"font-size:16px;font-weight:600\">6 · Renal Function &amp; Electrolytes<\u002Fdiv><span style=\"font-size:11px;font-weight:700;padding:3px 10px;border-radius:100px;background:#fff7e6;color:#7a5400\">Urine sample<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:7px;font-size:13px;line-height:1.5\">\n          <div><strong>U&amp;E<\u002Fstrong> — Na, K, urea, creatinine, eGFR · serum · Core<\u002Fdiv>\n          <div><strong>Bone profile<\u002Fstrong> — calcium, phosphate, ALP, albumin · serum · Targeted<\u002Fdiv>\n          <div><strong>Uric acid<\u002Fstrong> — hyperuricaemia, gout · serum · Targeted<\u002Fdiv>\n          <div><strong>Urine ACR<\u002Fstrong> — proteinuria, preferred first-line · urine pot · Core<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"background:#fff;border:1px solid #dfe0e0;border-radius:12px;padding:20px 22px\">\n        <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:12px\"><div style=\"font-size:16px;font-weight:600\">7 · Haematology &amp; Iron<\u002Fdiv><span style=\"font-size:11px;font-weight:700;padding:3px 10px;border-radius:100px;background:#e1f5ee;color:#0f6e56\">No fasting<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:7px;font-size:13px;line-height:1.5\">\n          <div><strong>FBC<\u002Fstrong> — RBC, WBC, platelets, indices · EDTA purple · Core<\u002Fdiv>\n          <div><strong>Iron studies<\u002Fstrong> — iron, TIBC, ferritin, transferrin sat. · serum · Targeted<\u002Fdiv>\n          <div><strong>Folate &amp; vitamin B12<\u002Fstrong> — macrocytosis, deficiency · serum · Targeted<\u002Fdiv>\n          <div><strong>ESR<\u002Fstrong> — inflammatory marker · per lab method · Specialist<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"background:#fff;border:1px solid #dfe0e0;border-radius:12px;padding:20px 22px\">\n        <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:12px\"><div style=\"font-size:16px;font-weight:600\">8 · Vitamins &amp; Nutritional<\u002Fdiv><span style=\"font-size:11px;font-weight:700;padding:3px 10px;border-radius:100px;background:#fff7e6;color:#7a5400\">One rapid test<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:7px;font-size:13px;line-height:1.5\">\n          <div><strong>Vitamin D (25-OH)<\u002Fstrong> — vitamin D status · serum · Targeted<\u002Fdiv>\n          <div><strong>Vitamin B12<\u002Fstrong> — cobalamin status · serum · Targeted<\u002Fdiv>\n          <div><strong>Folate (serum)<\u002Fstrong> — folate status · serum · Targeted<\u002Fdiv>\n          <div><strong>Magnesium<\u002Fstrong> — magnesium status · serum · Targeted<\u002Fdiv>\n          <div><strong>Zinc / selenium / copper<\u002Fstrong> — trace elements · royal blue tube · Specialist<\u002Fdiv>\n          <div><strong>Homocysteine<\u002Fstrong> — B-vitamin metabolism · EDTA, rapid processing · Specialist<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"background:#fff;border:1px solid #f0c36d;border-radius:12px;padding:20px 22px\">\n        <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:12px\"><div style=\"font-size:16px;font-weight:600\">9 · Hormones &amp; Endocrinology<\u002Fdiv><span style=\"font-size:11px;font-weight:700;padding:3px 10px;border-radius:100px;background:#fff7e6;color:#7a5400\">Timed draws<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:7px;font-size:13px;line-height:1.5\">\n          <div><strong>Testosterone (total ± free)<\u002Fstrong> — morning draw if specified · serum · Specialist<\u002Fdiv>\n          <div><strong>SHBG, DHEA-S<\u002Fstrong> — binding globulin, adrenal androgen · serum · Specialist<\u002Fdiv>\n          <div><strong>Oestradiol, FSH &amp; LH<\u002Fstrong> — ovarian/pituitary axis, cycle-day dependent · serum · Specialist<\u002Fdiv>\n          <div><strong>Prolactin<\u002Fstrong> — hyperprolactinaemia · serum · Specialist<\u002Fdiv>\n          <div><strong>Morning cortisol<\u002Fstrong> — 08:00–09:00 draw only · serum · Specialist<\u002Fdiv>\n          <div><strong>Progesterone / AMH<\u002Fstrong> — day 21 ovulation, ovarian reserve · serum or specialist tube · Specialist<\u002Fdiv>\n          <div><strong>Fasting insulin / IGF-1<\u002Fstrong> — insulin resistance, GH axis · serum, fasting · Specialist<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#fff7e6;border-radius:8px;padding:11px 13px;margin-top:12px;font-size:12px;line-height:1.5;color:#7a5400\">Ask the cycle day before you draw. A mistimed hormone sample is technically perfect and clinically worthless.<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"background:#fff;border:1px solid #dfe0e0;border-radius:12px;padding:20px 22px\">\n        <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:12px\"><div style=\"font-size:16px;font-weight:600\">10 · Autoimmune / Inflammatory<\u002Fdiv><span style=\"font-size:11px;font-weight:700;padding:3px 10px;border-radius:100px;background:#f2edfa;color:#5b3d8c\">Pathway-led<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:7px;font-size:13px;line-height:1.5\">\n          <div><strong>ANA, anti-dsDNA<\u002Fstrong> — autoimmune screen, SLE · serum · Specialist<\u002Fdiv>\n          <div><strong>RF, anti-CCP<\u002Fstrong> — rheumatoid markers · serum · Specialist<\u002Fdiv>\n          <div><strong>C3 &amp; C4<\u002Fstrong> — complement activity · serum · Specialist<\u002Fdiv>\n          <div><strong>Anti-TPO &amp; ant
