very 12 months, plus an unannounced spot audit per site per year. Any lapse suspends slot publishing automatically — the site disappears from patient search rather than serving patients under an expired standard.<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"background:#fff;border:1px solid #dfe0e0;border-radius:12px;padding:22px\">\n        <div style=\"font-size:16px;font-weight:600;margin-bottom:4px\">Capacity &amp; fees<\u002Fdiv>\n        <div style=\"font-size:12.5px;color:#6b7280;line-height:1.55;margin-bottom:16px\">The partner publishes hours and rooms; the hub converts that into bookable slots that already respect fasting and timed-draw rules.<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:11px;margin-bottom:18px\">\n          <div style=\"display:flex;justify-content:space-between;gap:10px;padding-bottom:9px;border-bottom:1px solid #dfe0e0\"><span style=\"font-size:13px;color:#6b7280\">Published capacity<\u002Fspan><span style=\"font-size:13px;font-weight:600\">Mon–Sat · 1 room · 20-min slots<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;justify-content:space-between;gap:10px;padding-bottom:9px;border-bottom:1px solid #dfe0e0\"><span style=\"font-size:13px;color:#6b7280\">Timed-draw window<\u002Fspan><span style=\"font-size:13px;font-weight:600\">08:00–09:00 held for cortisol<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;justify-content:space-between;gap:10px;padding-bottom:9px;border-bottom:1px solid #dfe0e0\"><span style=\"font-size:13px;color:#6b7280\">Courier cut-off<\u002Fspan><span style=\"font-size:13px;font-weight:600\">16:30 · no slots after 15:50<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;justify-content:space-between;gap:10px\"><span style=\"font-size:13px;color:#6b7280\">Utilisation this month<\u002Fspan><span style=\"font-size:13px;font-weight:600;color:#0f6e56\">71% · target 60–80%<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#f7f6f2;border:1px solid #dfe0e0;border-radius:10px;padding:16px\">\n          <div style=\"font-size:12px;font-weight:700;color:#6b7280;text-transform:uppercase;letter-spacing:.04em;margin-bottom:10px\">Per completed appointment<\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:8px\">\n            <div style=\"display:flex;justify-content:space-between\"><span style=\"font-size:13px\">Partner collection fee<\u002Fspan><span style=\"font-size:13px;font-weight:600;font-family:ui-monospace,monospace\">£—<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;justify-content:space-between\"><span style=\"font-size:13px\">Laboratory fee (panel-dependent)<\u002Fspan><span style=\"font-size:13px;font-weight:600;font-family:ui-monospace,monospace\">£—<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;justify-content:space-between\"><span style=\"font-size:13px\">Courier and consumables<\u002Fspan><span style=\"font-size:13px;font-weight:600;font-family:ui-monospace,monospace\">£—<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;justify-content:space-between\"><span style=\"font-size:13px\">Clinical review — internal cost<\u002Fspan><span style=\"font-size:13px;font-weight:600;font-family:ui-monospace,monospace\">£—<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;justify-content:space-between;border-top:1px solid #dfe0e0;padding-top:8px\"><span style=\"font-size:13px;font-weight:700\">Everest margin<\u002Fspan><span style=\"font-size:13px;font-weight:700;font-family:ui-monospace,monospace\">target &gt;40%<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font-size:12px;color:#6b7280;line-height:1.55;margin-top:12px\">Partner is paid on completed, dispatched, accepted samples — not on bookings. A rejected sample caused by site error is not billable, which puts the rejection-rate incentive where the control sits.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"background:#fff;border:1px solid #dfe0e0;border-radius:12px;padding:22px\">\n      <div style=\"display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:10px;margin-bottom:6px\">\n        <div style=\"font-size:16px;font-weight:600\">Network compliance — what the hub watches<\u002Fdiv>\n        <div style=\"font-size:12px;color:#6b7280\">4 sites live · 2 partners · quarterly governance review<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"font-size:12.5px;color:#6b7280;line-height:1.55;margin-bottom:18px\">Four metrics decide whether a partner stays in the network. Everything else is noise.<\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px\">\n        <div style=\"border:1px solid #b9e3d2;background:#e1f5ee;border-radius:10px;padding:16px\">\n          <div style=\"font-size:11px;font-weight:700;color:#0c5c47;text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px\">Sample rejection<\u002Fdiv>\n          <div style=\"font-size:26px;font-weight:700;color:#0c5c47;line-height:1.1\">0.8%<\u002Fdiv>\n          <div style=\"font-size:12px;color:#0c5c47;margin-top:5px\">Target under 2% · network-wide<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border:1px solid #f0c36d;background:#fff7e6;border-radius:10px;padding:16px\">\n          <div style=\"font-size:11px;font-weight:700;color:#7a5400;text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px\">Courier handover on time<\u002Fdiv>\n          <div style=\"font-size:26px;font-weight:700;color:#7a5400;line-height:1.1\">94%<\u002Fdiv>\n          <div style=\"font-size:12px;color:#7a5400;margin-top:5px\">Ashton pulling the average down<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border:1px solid #b9e3d2;background:#e1f5ee;border-radius:10px;padding:16px\">\n          <div style=\"font-size:11px;font-weight:700;color:#0c5c47;text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px\">Consent documented<\u002Fdiv>\n          <div style=\"font-size:26px;font-weight:700;color:#0c5c47;line-height:1.1\">100%<\u002Fdiv>\n          <div style=\"font-size:12px;color:#0c5c47;margin-top:5px\">Audited on 20 records per site per quarter<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border:1px solid #dfe0e0;border-radius:10px;padding:16px\">\n          <div style=\"font-size:11px;font-weight:700;color:#6b7280;text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px\">Incidents open &gt;24h<\u002Fdiv>\n          <div style=\"font-size:26px;font-weight:700;line-height:1.1\">1<\u002Fdiv>\n          <div style=\"font-size:12px;color:#6b7280;margin-top:5px\">Labelling error, Whalley Range · RCA due<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-top:16px\">\n        <div style=\"border-left:3px solid #7a5400;padding-left:12px\"><div style=\"font-size:13.5px;font-weight:600;margin-bottom:2px\">Warning<\u002Fdiv><div style=\"font-size:12.5px;color:#6b7280;line-height:1.55\">Two consecutive months outside a target triggers a remediation plan with a named owner and a re-audit date.<\u002Fdiv><\u002Fdiv>\n        <div style=\"border-left:3px solid #a32d2d;padding-left:12px\"><div style=\"font-size:13.5px;font-weight:600;margin-bottom:2px\">Suspension<\u002Fdiv><div style=\"font-size:12.5px;color:#6b7280;line-height:1.55\">Slot publishing stops immediately for an expired competency, a lapsed IPC audit, an unavailable emergency kit, or an uninvestigated serious incident.<\u002Fdiv><\u002Fdiv>\n        <div style=\"border-left:3px solid #6b7280;padding-left:12px\"><div style=\"font-size:13.5px;font-weight:600;margin-bottom:2px\">Exit<\u002Fdiv><div style=\"font-size:12.5px;color:#6b7280;line-height:1.55\">Patients with future bookings are moved to the nearest accredited site and told why in plain language. Phlebotomy records are transferred under the data sharing agreement.<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:900},&quot;showDesignNotes&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Review mode&quot;,&quot;label&quot;:&quot;Show design notes beside the questionnaire&quot;},&quot;providerName&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;the Everest clinical team&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Content&quot;,&quot;label&quot;:&quot;Clinical team name (CQC-registered service)&quot;},&quot;partnerLabel&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Accredited partner spoke&quot;,&quot;Partner pharmacy&quot;,&quot;Everest partner site&quot;],&quot;default&quot;:&quot;Accredited partner spoke&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Content&quot;,&quot;label&quot;:&quot;How partner sites are described to patients&quot;}}\">\nconst PANELS = [\n  {id:'general', name:'General Health Screen', tests:'FBC · U&E · LFTs · TSH · HbA1c · CRP · Ferritin', prep:'No fasting required', goals:['checkup','tired']},\n  {id:'diabetes', name:'Diabetes Monitoring', tests:'HbA1c · fasting glucose · U&E · lipids · urine ACR', prep:'8–10 hour fast if fasting glucose included', goals:['monitor']},\n  {id:'thyroid', name:'Thyroid Function', tests:'TSH · FT4 · FT3 · thyroid antibodies', prep:'No fasting required', goals:['tired','monitor']},\n  {id:'cardio', name:'Cardiovascular Risk', tests:'Lipid profile · ApoB · Lp(a) · hsCRP · HbA1c', prep:'Non-fasting acceptable', goals:['heart']},\n  {id:'liver', name:'Liver Health', tests:'LFTs · ferritin · PT/INR · HBsAg · anti-HCV', prep:'No fasting required', goals:['monitor']},\n  {id:'renal', name:'Renal Function & Electrolytes', tests:'U&E · bone profile · uric acid · urine ACR', prep:'Urine sample needed — bring or provide on site', goals:['monitor']},\n  {id:'haem', name:'Haematology & Iron', tests:'FBC · iron studies · folate · B12 · ESR', prep:'No fasting required', goals:['tired']},\n  {id:'vitamins', name:'Vitamins & Nutritional', tests:'Vitamin D · B12 · folate · magnesium · trace elements', prep:'No fasting required', goals:['tired','checkup']},\n  {id:'hormones', name:'Hormones & Endocrinology', tests:'Testosterone · SHBG · oestradiol · FSH/LH · prolactin · cortisol · AMH', prep:'Timed draw: 08:00–09:00 for cortisol, day 21 for progesterone', goals:['hormones']},\n  {id:'auto', name:'Autoimmune / Inflammatory', tests:'ANA · anti-dsDNA · RF · anti-CCP · C3/C4 · anti-TPO · IgE', prep:'No fasting required', goals:['symptoms']},\n  {id:'wellperson', name:'Well Woman / Well Man Profile', tests:'FBC · U&E · LFTs · bone profile · lipids · glucose · ferritin · TSH · (Well Man adds PSA)', prep:'No fasting required', goals:['checkup']},\n  {id:'fatigue', name:'Tiredness & Fatigue Profile', tests:'FBC · ferritin · B12 · folate · TSH · FT4 · coeliac screen · U&E · LFTs · CRP · glucose', prep:'No fasting required', goals:['tired']},\n  {id:'glp1', name:'Weight-loss Management (GLP-1 monitoring)', tests:'HbA1c · lipids · LFTs · U&E · TSH · fasting insulin · amylase or lipase', prep:'8–10 hour fast — morning slots only', goals:['weight']},\n  {id:'pcos', name:'PCOS Screen', tests:'Testosterone · SHBG · free androgen index · LH · FSH · prolactin · DHEA-S · TSH · glucose · insulin', prep:'Cycle day 2–5 where periods occur · fasting for glucose and insulin', goals:['hormones']},\n  {id:'heart', name:'Heart Health Profile', tests:'Lipid profile · ApoA1 · ApoB · Lp(a) · hsCRP · homocysteine · HbA1c · U&E', prep:'No fasting required · homocysteine needs the priority courier run', goals:['heart']},\n  {id:'prostate', name:'Prostate Profile', tests:'Total PSA · free PSA · free:total ratio', prep:'No ejaculation, cycling or DRE for 48 hours before the sample', goals:['prostate']}\n];\n\nconst PANEL_INFO = {\n  general: {q:'Am I generally alright?', body:'A broad look at the systems that quietly go wrong without symptoms — blood, kidneys, liver, thyroid and blood sugar. It is the panel to pick if nothing specific is worrying you and you want a baseline to measure against in future.', tells:['Whether you are anaemic or low in iron','How well your kidneys and liver are working','Whether your thyroid is over- or under-active','Whether your blood sugar is drifting towards diabetes']},\n  diabetes: {q:'Is my diabetes under control?', body:'HbA1c shows your average blood sugar over roughly three months, so it cannot be fixed by one careful week. The rest of the panel checks the organs that diabetes strains first.', tells:['Your average blood sugar since the summer','Whether your kidneys are showing early strain','Whether your cholesterol is adding to your risk','Protein leaking into your urine — the earliest warning sign']},\n  thyroid: {q:'Is my thyroid behind how I feel?', body:'The thyroid sets your body\\'s pace. Too slow causes tiredness, weight gain and feeling cold; too fast causes anxiety, palpitations and weight loss. Both are common and both are treatable.', tells:['Whether your thyroid is under- or over-active','How hard your brain is pushing the thyroid to work','Whether your immune system is attacking the gland']},\n  cardio: {q:'What is my risk of a heart attack or stroke?', body:'Cholesterol is not one number. This panel separates the kind that clogs arteries from the kind that protects them, and adds an inherited risk marker most standard tests never measure.', tells:['The artery-clogging cholesterol (LDL) and the protective kind (HDL)','ApoB — a more accurate count of harmful particles than LDL alone','Lp(a), an inherited risk you only need measured once in your life','Whether your blood sugar is adding to the risk']},\n  liver: {q:'Is my liver being damaged?', body:'The liver rarely complains until late, which is why enzyme levels matter. Raised ones mean liver cells are under strain — from alcohol, fat, medicines or a virus — long before you would feel it.', tells:['Whether liver cells are inflamed or damaged','How well the liver is still doing its job','Whether hepatitis B or C is the cause','Iron overload, a treatable inherited cause of liver damage']},\n  renal: {q:'Are my kidneys filtering properly?', body:'Kidneys lose function silently and do not regenerate, so early detection genuinely changes the outcome. The urine test often picks up damage before the blood test does.', tells:['Your eGFR — how much filtering capacity you have left','Whether your salts and minerals are balanced','Protein leaking into urine, the earliest sign of damage','Uric acid, the cause of gout']},\n  haem: {q:'Why am I so tired?', body:'Tiredness has a short list of common blood causes, and most are straightforwardly treatable. This panel works through them in one draw.', tells:['Whether you are anaemic, and what type','Your iron stores — often low long before anaemia appears','B12 and folate, both common and easily corrected','Whether inflammation somewhere is driving it']},\n  vitamins: {q:'Am I actually deficient, or just guessing?', body:'Most people supplement without ever measuring. This tells you which deficiencies you genuinely have, so you can stop buying the ones you do not.', tells:['Vitamin D — deficiency is very common in the UK','B12 and folate, needed for nerves and blood cells','Magnesium, involved in muscle and heart rhythm','Zinc, selenium and copper, where diet is restricted']},\n  hormones: {q:'Are my hormones explaining my symptoms?', body:'Hormones swing through the day and through the monthly cycle, so when the blood is taken matters as much as what is measured. We will book you into the right window.', tells:['Testosterone and the protein that binds it','Where you are in the menopause transition','Cortisol, your stress and energy hormone','Ovarian reserve (AMH) if fertility is the question']},\n  auto: {q:'Is my immune system attacking my own body?', body:'Autoimmune conditions are diagnosed from symptoms and examination as well as antibodies — a positive result is a clue, not a verdict. These tests are requested when there is already a clinical reason.', tells:['Antibodies linked to lupus and connective tissue disease','Markers for rheumatoid arthritis','Whether your immune system is actively consuming complement','Autoimmune thyroid antibodies']},\n  wellperson: {q:'A thorough annual check — what is the picture?', body:'The broadest routine panel we offer: the general screen plus bone chemistry and, for men over 50, a prostate marker. Good as a yearly baseline, especially once you are past 40.', tells:['Blood count, kidneys, liver and thyroid','Bone chemistry including calcium','Cholesterol and blood sugar','Iron stores, and PSA for men where appropriate']},\n  fatigue: {q:'I am exhausted and I do not know why.', body:'Purpose-built for persistent tiredness. It covers the common causes in one draw rather than the usual sequence of separate tests over several months.', tells:['Anaemia, low iron, low B12 or low folate','An under-active thyroid','Coeliac disease — you must still be eating gluten for this to work','Hidden inflammation, or kidney and liver causes']},\n  glp1: {q:'Is my weight-loss treatment working and safe?', body:'Baseline before you start, then at review. It tracks the benefit you are gaining and the few things worth watching while on a GLP-1 medicine.', tells:['Your average blood sugar and cholesterol response','Liver and kidney function while on treatment','Insulin resistance — often the thing that improves first','A pancreatic enzyme check, as a safety measure']},\n  pcos: {q:'Could this be PCOS?', body:'PCOS is diagnosed from a combination of blood results, symptoms and sometimes a scan — never from blood alone. This panel provides the blood half and rules out conditions that look similar.', tells:['Whether male-type hormones are raised','The LH to FSH ratio, often altered in PCOS','Thyroid and prolactin, which can mimic PCOS','Insulin resistance, which drives many of the symptoms']},\n  heart: {q:'The fullest cardiovascular picture available.', body:'Everything in the standard cholesterol panel plus the advanced markers — particle counts, inherited risk and vascular inflammation. Worth it if heart disease runs in your family.', tells:['A full cholesterol breakdown, including particle counts','Lp(a) — inherited risk, measured once for life','hsCRP, a marker of inflammation inside artery walls','Homocysteine, linked to vascular risk']},\n  prostate: {q:'Should I be worried about my prostate?', body:'PSA is a useful but imperfect test. It rises with cancer, but also with age, infection, cycling and recent sex — which is why we ask about all of those, and why the free:total ratio matters.', tells:['Your total PSA level','The free fraction, which helps distinguish benign causes','The ratio between them, more informative than PSA alone','Whether a GP conversation is warranted']}\n};\n\nconst SITES = [\n  {id:'whalley', name:'Everest Pharmacy — Whalley Range', meta:'Everest site · Mon–Sat · next slot Fri 09:20', partner:false},\n  {id:'didsbury', name:'Everest Pharmacy — Didsbury', meta:'Everest site · Mon–Fri · next slot Thu 14:00', partner:false},\n  {id:'chorleyold', name:'Everest Pharmacy — Chorley Old Road', meta:'Everest site · Mon–Sat · next slot Sat 11:15', partner:false},\n  {id:'chorlton', name:'Everest Pharmacy — Chorlton Village', meta:'Everest site · Mon–Sat · next slot Thu 10:40', partner:false},\n  {id:'swanlane', name:'Swan Lane Pharmacy, Bolton', meta:'Accredited partner spoke · next slot Fri 15:20', partner:true}\n];\n\nconst REDFLAGS = [\n  {v:'chest', l:'Chest pain, pressure or tightness'},\n  {v:'breath', l:'Breathlessness at rest or new severe breathlessness'},\n  {v:'confusion', l:'New confusion, drowsiness or difficulty waking'},\n  {v:'abdo', l:'Severe or persistent abdominal pain'},\n  {v:'fever', l:'Fever above 38°C, or feeling acutely unwell today'},\n  {v:'bleed', l:'Bleeding that will not stop, or blood in vomit or stool'},\n  {v:'faint', l:'Fainted or collapsed in the last 24 hours'},\n  {v:'none', l:'None of these', clear:true}\n];\n\nconst CONTRA = [\n  {v:'bleeding', l:'A bleeding or clotting disorder', meta:'Needs clinician review before booking'},\n  {v:'anticoag', l:'I take warfarin, a DOAC or another anticoagulant', meta:'Needs clinician review before booking'},\n  {v:'bbv', l:'A known blood-borne virus (hepatitis B/C, HIV)', meta:'Referred to a specialist phlebotomy suite'},\n  {v:'phobia', l:'Severe needle phobia or I have fainted during a blood test', meta:'Referred to GP or supported appointment'},\n  {v:'capacity', l:'I need someone else to consent on my behalf', meta:'Cannot be booked online'},\n  {v:'none', l:'None of these', clear:true}\n];\n\nconst STEPS = [\n  {\n    id:'welcome', kicker:'Before you start', title:'A blood test at your pharmacy, read by our clinicians',\n    hint:'Takes about three minutes. We ask about your symptoms and history first, because some answers mean a blood test is not the safest next step today.',\n    notice:'The pharmacy takes your blood sample and sends it to a UKAS-accredited laboratory. Everest is the CQC-registered provider for this service: a registered clinician in the Everest clinical team reviews every result, explains it to you, and writes to your GP where needed. The staff who take your blood do not interpret results.',\n    kind:'info', next:'Start',\n    noteTitle:'One brand, two roles — stated up front',\n    notes:[\n      'Everest holds both roles: the pharmacy is the collection spoke, and Everest Clinical Services is the CQC-registered provider that reviews results. The patient sees one brand; governance still sees two separate accountabilities, and the copy has to hold that line without sounding like a disclaimer.',\n      'Registered role, laboratory accreditation and the results route are all stated before any personal data is collected.',\n      'No price or panel is shown yet: the screening gates come first so an ineligible patient never reaches payment.'\n    ]\n  },\n  {\n    id:'goal', kicker:'Step 1 of 8', title:'What brings you in?',\n    hint:'We use this to recommend a panel. You can browse all ten panels on the next screen.',\n    kind:'single', key:'goal',\n    options:[\n      {v:'checkup', l:'A general check — nothing specific', meta:'Most people start here'},\n      {v:'tired', l:'Tiredness, low energy or feeling run down', meta:'Iron, thyroid, vitamins'},\n      {v:'monitor', l:'Monitoring a condition I already have', meta:'Diabetes, thyroid, liver, kidney'},\n      {v:'heart', l:'Heart and cholesterol risk', meta:'Lipids, ApoB, Lp(a)'},\n      {v:'hormones', l:'Hormones, fertility or the menopause', meta:'Timed samples may be needed'},\n      {v:'weight', l:'Monitoring for weight-loss treatment', meta:'GLP-1 baseline and review bloods'},\n      {v:'prostate', l:'Prostate checks', meta:'PSA and free:total ratio'},\n      {v:'symptoms', l:'Symptoms my GP asked me to investigate', meta:'Bring the test names if you have them'}\n    ],\n    noteTitle:'Recommend, then let them browse',\n    notes:[\n      'A goal question does the work of a triage nurse without giving clinical advice: it narrows ten panels to one recommendation plus the full list, which is exactly what was asked for.',\n      'The answer is stored as a stated reason for testing — useful evidence for \"clinically appropriate test request\" in the eligibility criteria.',\n      'Fertility and hormone goals silently switch on the timed-sample rules later in the flow.'\n    ]\n  },\n  {\n    id:'panel', kicker:'Step 2 of 8', title:'Choose your panel',\n    hint:'Recommended for you is shown first. Tap the i on any panel to see what it tests and why it matters. All sixteen go to the same UKAS ISO 15189 laboratory.',\n    kind:'panels', key:'panel',\n    noteTitle:'Sixteen panels, one recommendation',\n    notes:[\n      'Panel cards state what is measured and what preparation it demands — the two things that decide whether a sample is usable.',\n      'The six lab-catalogue panels (Well Woman/Man, Fatigue, GLP-1 monitoring, PCOS, Heart Health, Prostate) are commercially named products the laboratory already bundles and prices — cheaper to buy than an equivalent custom build, and they arrive with the lab\\'s own reference ranges.',\n      '\"Specialist\" tests (Lp(a), AMH, ANA) stay visible but carry the timing rule on the card, so expectations are set before the slot is picked.',\n      'Tube types and centrifugation stay out of patient view; they belong to the branch worksheet in the ops console.'\n    ]\n  },\n  {\n    id:'redflags', kicker:'Step 3 of 8', title:'Do you have any of these right now?',\n    hint:'Select all that apply. This is a safety check, not a diagnosis.',\n    kind:'multi', key:'redflags', options:REDFLAGS,\n    stopIf:true,\n    stopTag:'Please do not book today',\n    stopTitle:'These symptoms need to be seen today, not tested in a few days',\n    stopBody:'A blood test would not change what you need right now. Please contact your GP for a same-day appointment, or call 999 if you feel very unwell. We have not taken payment and nothing has been booked. Your answers have been saved so we can pick this up when you are well.',\n    noteTitle:'The hard stop',\n    notes:[\n      'This is the one screen that must not be skippable or dismissible. Selecting any red flag ends the booking outright — no \"continue anyway\", no payment page.',\n      'The stop screen states the advice given, offers 999 and GP routes, and confirms no payment was taken. The record written behind it is the screening audit trail: symptoms, advice, timestamp.',\n      '\"None of these\" is a deliberate positive confirmation rather than an empty submit, so silence is never read as safety.'\n    ]\n  },\n  {\n    id:'contra', kicker:'Step 4 of 8', title:'Does any of this apply to you?',\n    hint:'Select all that apply. Some answers mean a clinician reviews your booking first.',\n    kind:'multi', key:'contra', options:CONTRA,\n    reviewIf:true,\n    noteTitle:'Exclusion versus review',\n    notes:[\n      'The governance framework separates outright exclusion (known BBV, no capacity to consent) from \"proceed once reviewed\" (anticoagulation, bleeding disorders). The questionnaire mirrors that split instead of failing everyone.',\n      'A review answer holds the slot as provisional and drops the booking into the clinician pre-review queue in the ops console.',\n      'Needle phobia and previous fainting route to a supported appointment rather than a refusal — it protects the sample and the patient.'\n    ]\n  },\n  {\n    id:'meds', kicker:'Step 5 of 8', title:'Medicines and pregnancy',\n    hint:'Both can change how a result is read, and one changes whether we test at all.',\n    kind:'single', key:'pregnancy',\n    notice:'You will be asked to list your current medicines at the appointment and they are recorded on the request form sent to the laboratory.',\n    options:[\n      {v:'na', l:'Not applicable to me', meta:''},\n      {v:'no', l:'Not pregnant', meta:''},\n      {v:'first', l:'Pregnant — first trimester', meta:'Referred to your GP unless urgent'},\n      {v:'later', l:'Pregnant — 12 weeks or more', meta:'Booked with a note to the clinician'},\n      {v:'trying', l:'Trying to conceive', meta:'Affects hormone panel timing'}\n    ],\n    noteTitle:'Two questions, one screen',\n    notes:[\n      'First-trimester pregnancy is a referral under the framework, so it needs asking before a slot is taken — but it does not deserve a screen of its own in a three-minute flow.',\n      'A free-text medicines list online is low-value and high-risk: it is captured at the appointment instead, where staff can read it back and attach it to the request.',\n      'Anticoagulants were already captured on the previous screen, where they trigger review rather than a note.'\n    ]\n  },\n  {\n    id:'prep', kicker:'Step 6 of 8', title:'How to prepare',\n    hint:'Your panel sets these rules. Slots that do not fit them are hidden on the next screen.',\n    kind:'prep',\n    noteTitle:'Prep drives the calendar, not a leaflet',\n    notes:[\n      'Fasting, morning cortisol and day-21 progesterone are turned into slot filters rather than instructions the patient has to remember and honour.',\n      'Sample rejection target is under 2%. Most rejections are avoidable prep and labelling failures, so the booking engine is the cheapest place to fix them.',\n      'The same rules print on the confirmation email and on the branch worksheet, so patient and phlebotomist read one source.'\n    ]\n  },\n  {\n    id:'site', kicker:'Step 7 of 8', title:'Where would you like to be seen?',\n    hint:'Partner pharmacies are independently owned, accredited spokes. Your results are handled identically wherever you go.',\n    kind:'sites', key:'site',\n    noteTitle:'Partner sites, identical promise',\n    notes:[\n      'Partner pharmacies are labelled as accredited spokes rather than hidden behind our brand — honest, and it is what the consent wording has to say anyway. Everest remains the registered provider whichever site they choose.',\n      'Only sites that hold current accreditation, a passed IPC audit and two competency-signed staff appear in this list. Accreditation lapse removes the site from search, it does not warn a patient at the door.',\n      'The partner keeps ownership of its own environment and phlebotomy record; the clinical record and results route stay with the CQC provider.'\n    ]\n  },\n  {\n    id:'consent', kicker:'Step 8 of 8', title:'Consent',\n    hint:'Tick each statement to continue. You will sign a consent form at the appointment as well.',\n    kind:'multi', key:'consent', requireAll:true,\n    options:[\n      {v:'c1', l:'I am 18 or over and I am booking this test for myself', meta:'Tests cannot be transferred to another person'},\n      {v:'c2', l:'I agree that my sample and details are shared with the laboratory and the Everest clinical team', meta:'Special category data, UK GDPR Art 9(2)(h)'},\n      {v:'c3', l:'I understand the staff taking my blood cannot interpret my results', meta:'A registered clinician in the Everest clinical team explains them'},\n      {v:'c4', l:'I agree that abnormal results may be shared with my GP', meta:'Always for critical results'}\n    ],\n    noteTitle:'Consent that names the boundary',\n    notes:[\n      'Each statement maps to a line on the paper consent form so the online consent and the signed consent cannot drift apart.',\n      'Because Everest is both spoke and registered provider, consent has to name the clinical team explicitly — otherwise \"we\" quietly blurs the boundary the registration depends on.',\n      'The personal-use statement is the medical data breach control: it is why the account holder, not the arm in the chair, is the record subject.',\n      'GP sharing is consented here and is non-optional for critical results — stated plainly rather than buried.'\n    ]\n  },\n  {\n    id:'review', kicker:'Almost done', title:'Check and confirm',\n    hint:'Payment is taken by Everest. Partner sites are paid a collection fee — you never pay them directly.',\n    kind:'review', next:'Confirm and pay £—',\n    noteTitle:'Where money sits in the model',\n    notes:[\n      'Payment is collected by the pharmacy on behalf of the registered service. Where the spoke is a partner pharmacy, the patient still pays Everest — the partner is paid a collection fee, never the patient.',\n      'The review screen is the last non-clinical checkpoint: panel, prep, site and consent in one view, each editable without restarting.',\n      'Price is left as a placeholder until the lab and courier contracts are priced.'\n    ]\n  },\n  {\n    id:'done', kicker:'', title:'You are booked', hint:'', kind:'done',\n    noteTitle:'Setting expectations for results',\n    notes:[\n      'The confirmation screen is the right place to state the 48–72 hour standard and the one-hour critical-result call, because that is the promise the registered service is measured against at inspection.',\n      '\"A clinician calls you\" is a stronger safety net than a portal notification, and it is what the escalation SOP actually requires.',\n      'Nothing on this screen implies the branch counter will discuss results — the call comes from the clinical team.'\n    ]\n  }\n];\n\nconst VIEWS = [\n  {id:'patient', label:'Patient questionnaire'},\n  {id:'results', label:'Patient results'},\n  {id:'journey', label:'Staff journey guide'},\n  {id:'workflow', label:'Workflow diagram'},\n  {id:'console', label:'Ops console'},\n  {id:'record', label:'Clinical record'},\n  {id:'guide', label:'Staff guide'},\n  {id:'partner', label:'Partner model'}\n];\n\nclass Component extends DCLogic {\n  state = { recordTab:'overview', openPanel:null, view:'patient', step:0, a:{goal:null,panel:null,redflags:[],contra:[],pregnancy:null,site:null,consent:[]}, stop:null, consoleTab:'today', guideCard:0 };\n\n  step(){ return STEPS[this.state.step]; }\n\n  setA(key, val){ this.setState(s => ({ a: Object.assign({}, s.a, {[key]:val}) })); }\n\n  toggle(key, v, clear){\n    const cur = this.state.a[key] || [];\n    let nextArr;\n    if (clear) nextArr = cur.includes(v) ? [] : [v];\n    else nextArr = cur.includes(v) ? cur.filter(x => x !== v) : cur.filter(x => x !== 'none').concat([v]);\n    this.setA(key, nextArr);\n  }\n\n  recommended(){\n    const g = this.state.a.goal;\n    const hit = PANELS.find(p => p.goals.includes(g));\n    return hit ? hit.id : 'general';\n  }\n\n  panelObj(){ return PANELS.find(p => p.id === this.state.a.panel) || PANELS.find(p => p.id === this.recommended()); }\n  siteObj(){ return SITES.find(s => s.id === this.state.a.site); }\n\n  advance(){\n    const st = this.step();\n    if (st.stopIf) {\n      const flags = (this.state.a.redflags || []).filter(v => v !== 'none');\n      if (flags.length) { this.setState({stop:'redflag'}); return; }\n    }\n    if (st.id === 'contra') {\n      const c = this.state.a.contra || [];\n      if (c.includes('bbv') || c.includes('capacity')) { this.setState({stop:'exclude'}); return; }\n    }\n    if (st.id === 'meds' && this.state.a.pregnancy === 'first') { this.setState({stop:'pregnancy'}); return; }\n    if (st.id === 'panel' && !this.state.a.panel) this.setA('panel', this.recommended());\n    this.setState(s => ({ step: Math.min(s.step + 1, STEPS.length - 1) }));\n  }\n\n  canAdvance(){\n    const st = this.step();\n    const a = this.state.a;\n    if (st.kind === 'single') return !!a[st.key];\n    if (st.kind === 'panels') return true;\n    if (st.kind === 'sites') return !!a.site;\n    if (st.kind === 'multi') {\n      const sel = a[st.key] || [];\n      if (st.requireAll) return sel.length === (st.options || []).length;\n      return sel.length > 0;\n    }\n    return st.kind !== 'done';\n  }\n\n  stopCopy(){\n    const k = this.state.stop;\n    if (k === 'redflag') return {tag:this.step().stopTag, title:this.step().stopTitle, body:this.step().stopBody};\n    if (k === 'exclude') return {\n      tag:'We cannot book this online',\n      title:'This booking needs to be arranged by a person, not a form',\n      body:'Based on your answers this test should be taken in a specialist phlebotomy setting, or consent needs to be arranged with your legal representative. Nothing has been booked and no payment has been taken. Call the branch on the number in your confirmation email and a pharmacist will talk it through with you, or speak to your GP.'\n    };\n    return {\n      tag:'Please speak to your GP first',\n      title:'In the first twelve weeks of pregnancy we refer rather than test',\n      body:'Blood tests in early pregnancy are arranged through your GP or midwife so that the right tests are requested and the results go to the team looking after you. Nothing has been booked and no payment has been taken. If your GP has asked for an urgent private test, call the branch and a pharmacist will arrange it.'\n    };\n  }\n\n  renderVals(){\n    const s = this.state;\n    const st = this.step();\n    const a = s.a;\n    const vals = {\n      navItems: VIEWS.map(v => ({\n        label: v.label,\n        go: () => this.setState({view:v.id}),\n        style: 'appearance:none;border:none;background:transparent;cursor:pointer;padding:15px 16px;font-size:13.5px;font-family:inherit;'\n          + (s.view === v.id\n            ? 'font-weight:700;color:#102a43;box-shadow:inset 0 -3px 0 #0f6e56;'\n            : 'font-weight:500;color:#6b7280;')\n      })),\n      isPatient: s.view === 'patient',\n      isResults: s.view === 'results',\n      isJourney: s.view === 'journey',\n      isWorkflow: s.view === 'workflow',\n      isConsole: s.view === 'console',\n      isRecord: s.view === 'record',\n      recordTabs: [\n        {id:'overview', label:'Overview'},\n        {id:'results', label:'Results & interpretation'},\n        {id:'notes', label:'Clinical notes'},\n        {id:'letter', label:'Correspondence'}\n      ].map(t => ({\n        label: t.label,\n        go: () => this.setState({recordTab:t.id}),\n        style: 'appearance:none;font-family:inherit;cursor:pointer;padding:9px 15px;border-radius:6px;font-size:13px;border:1px solid '\n          + (s.recordTab === t.id ? '#5b3d8c' : '#dfe0e0') + ';background:' + (s.recordTab === t.id ? '#f2edfa' : '#fff')\n          + ';color:' + (s.recordTab === t.id ? '#4a2f78' : '#6b7280') + ';font-weight:' + (s.recordTab === t.id ? '700' : '500')\n      })),\n      rOverview: s.recordTab === 'overview' && s.view === 'record',\n      rResults: s.recordTab === 'results' && s.view === 'record',\n      rNotes: s.recordTab === 'notes' && s.view === 'record',\n      rLetter: s.recordTab === 'letter' && s.view === 'record',\n      isGuide: s.view === 'guide',\n      isPartner: s.view === 'partner',\n      restart: () => this.setState({step:0, stop:null, a:{goal:null,panel:null,redflags:[],contra:[],pregnancy:null,site:null,consent:[]}}),\n      next: () => this.advance(),\n      back: () => this.setState(x => ({step: Math.max(0, x.step - 1)})),\n      showNotes: this.props.showDesignNotes !== false,\n      stopped: !!s.stop,\n      live: !s.stop,\n      consoleTabs: [\n        {id:'today', label:'Today at this site', count:'7'},\n        {id:'review', label:'Pre-booking review', count:'2'},\n        {id:'samples', label:'Samples & chain of custody', count:'11'},\n        {id:'results', label:'Results awaiting clinician', count:'14'},\n        {id:'escalation', label:'Escalations', count:'1'}\n      ].map(t => ({\n        label: t.label, count: t.count,\n        go: () => this.setState({consoleTab:t.id}),\n        style: 'appearance:none;font-family:inherit;text-align:left;cursor:pointer;width:100%;display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:6px;font-size:13px;border:1px solid '\n          + (s.consoleTab === t.id ? '#0f6e56' : 'transparent') + ';background:' + (s.consoleTab === t.id ? '#e1f5ee' : 'transparent')\n          + ';color:' + (s.consoleTab === t.id ? '#0c5c47' : '#1c1f23') + ';font-weight:' + (s.consoleTab === t.id ? '700' : '500'),\n        countStyle: 'margin-left:auto;font-size:11px;font-weight:700;padding:2px 8px;border-radius:100px;background:'\n          + (t.id === 'escalation' ? '#fcebeb;color:#a32d2d' : s.consoleTab === t.id ? '#fff;color:#0f6e56' : '#f1f1f0;color:#6b7280')\n      })),\n      cTab: s.consoleTab,\n      isToday: s.consoleTab === 'today',\n      isReviewQ: s.consoleTab === 'review',\n      isSamples: s.consoleTab === 'samples',\n      isResultsQueue: s.consoleTab === 'results' && s.view === 'console',\n      isEscalation: s.consoleTab === 'escalation'\n    };\n\n    if (s.stop) {\n      const c = this.stopCopy();\n      vals.stopTag = c.tag; vals.stopTitle = c.title; vals.stopBody = c.body;\n      vals.progressStyle = 'height:100%;background:#a32d2d;width:100%';\n      vals.progressLabel = 'Booking stopped';\n      vals.noteTitle = 'Stop screens are part of the service, not an error state';\n      vals.notes = [\n        'Every stop says three things: what to do now, that no payment was taken, and how to reach a human. Ambiguity here is what turns a safe refusal into a complaint.',\n        'The 999 / GP / 111 box is identical on all three stop screens so staff can describe it consistently on the phone.',\n        'Stops are logged with the answer set and shown in the ops console, so a pattern of stops at one site gets noticed at joint governance review.'\n      ];\n      return vals;\n    }\n\n    const pct = Math.round((s.step / (STEPS.length - 1)) * 100);\n    vals.progressStyle = 'height:100%;background:#0f6e56;width:' + pct + '%';\n    vals.progressLabel = st.kind === 'done' ? 'Complete' : pct + '% complete';\n    vals.stepKicker = st.kicker || 'Confirmed';\n    vals.stepTitle = st.title;\n    vals.stepHint = st.hint;\n    const provider = this.props.providerName || 'the Everest clinical team';\n    vals.hasNotice = !!st.notice;\n    vals.noticeText = (st.notice || '').replace('the Everest clinical team', provider);\n    vals.noteTitle = st.noteTitle;\n    vals.notes = st.notes;\n    vals.isReview = st.kind === 'review';\n    vals.isDone = st.kind === 'done';\n    vals.showBack = s.step > 0 && st.kind !== 'done';\n    vals.showNext = st.kind !== 'done';\n    const ok = this.canAdvance();\n    vals.nextLabel = st.next || 'Continue';\n    vals.nextStyle = 'margin-top:20px;width:100%;padding:14px;border-radius:6px;border:none;font-size:15px;font-weight:600;font-family:inherit;cursor:'\n      + (ok ? 'pointer;background:#0f6e56;color:#fff' : 'not-allowed;background:#e6e6e3;color:#a8a49a');\n    if (!ok) vals.next = () => {};\n\n    let opts = [];\n    if (st.kind === 'single') {\n      opts = st.options.map(o => {\n        const sel = a[st.key] === o.v;\n        return this.optView(o.l, o.meta, sel, () => this.setA(st.key, o.v), false);\n      });\n    } else if (st.kind === 'multi') {\n      opts = st.options.map(o => {\n        const sel = (a[st.key] || []).includes(o.v);\n        const danger = st.stopIf && o.v !== 'none';\n        return this.optView(o.l, o.meta, sel, () => this.toggle(st.key, o.v, o.clear), danger);\n      });\n    } else if (st.kind === 'sites') {\n      const plabel = this.props.partnerLabel || 'Accredited partner spoke';\n      opts = SITES.map(x => this.optView(x.name, x.partner ? x.meta.replace('Accredited partner spoke', plabel) : x.meta, a.site === x.id, () => this.setA('site', x.id), false));\n    } else if (st.kind === 'prep') {\n      const p = this.panelObj();\n      opts = [\n        this.optView(p.prep, 'Set by your panel: ' + p.name, true, () => {}, false),\n        this.optView('Drink water normally', 'Well-hydrated veins make a single attempt far more likely', true, () => {}, false),\n        this.optView('Bring photo ID', 'We check identity before taking any sample', true, () => {}, false),\n        this.optView('Allow 20 minutes', '15 minutes clinical, 5 minutes documentation', true, () => {}, false)\n      ];\n    }\n    vals.hasOptions = opts.length > 0;\n    vals.options = opts;\n\n    vals.isPanels = st.kind === 'panels';\n    if (st.kind === 'panels') {\n      const rec = this.recommended();\n      const ordered = PANELS.slice().sort((x, y) => (x.id === rec ? -1 : y.id === rec ? 1 : 0));\n      vals.panelCards = ordered.map(p => {\n        const sel = (a.panel || rec) === p.id;\n        const open = s.openPanel === p.id;\n        const info = PANEL_INFO[p.id] || {q:'', body:'', tells:[]};\n        return {\n          name: p.name,\n          recommended: p.id === rec,\n          tests: p.tests,\n          prep: p.prep,\n          question: info.q,\n          body: info.body,\n          tells: info.tells,\n          open: open,\n          pick: () => this.setState({ a: Object.assign({}, a, {panel:p.id}), openPanel: open ? null : p.id }),\n          toggle: (e) => { if (e && e.stopPropagation) e.stopPropagation(); this.setState({ openPanel: open ? null : p.id }); },\n          cardStyle: 'appearance:none;font-family:inherit;text-align:left;width:100%;cursor:pointer;padding:14px 16px;border-radius:10px;background:'\n            + (sel ? '#e1f5ee' : '#fff') + ';border:1.5px solid ' + (sel ? '#0f6e56' : '#dfe0e0') + ';color:#1c1f23;display:block',\n          dot: 'flex:0 0 16px;height:16px;border-radius:50%;margin-top:3px;border:1.5px solid ' + (sel ? '#0f6e56' : '#c9cac9')\n            + ';background:' + (sel ? '#0f6e56' : '#fff') + ';box-shadow:' + (sel ? 'inset 0 0 0 3px #fff' : 'none'),\n          infoStyle: 'appearance:none;font-family:inherit;cursor:pointer;flex:0 0 auto;width:22px;height:22px;border-radius:50%;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;border:1.5px solid '\n            + (open ? '#0f6e56' : '#c9cac9') + ';background:' + (open ? '#0f6e56' : '#fff') + ';color:' + (open ? '#fff' : '#6b7280'),\n          infoLabel: open ? '×' : 'i',\n          recStyle: 'display:' + (p.id === rec ? 'inline-block' : 'none') + ';padding:2px 9px;border-radius:100px;font-size:10.5px;font-weight:700;background:#0f6e56;color:#fff;letter-spacing:.03em;text-transform:uppercase',\n          detailStyle: 'display:' + (open ? 'block' : 'none') + ';margin-top:12px;padding-top:12px;border-top:1px solid ' + (sel ? '#b9e3d2' : '#dfe0e0')\n        };\n      });\n    }\n\n    if (st.kind === 'review') {\n      const p = this.panelObj(); const site = this.siteObj();\n      vals.summary = [\n        {label:'Panel', value:p.name + ' — ' + p.tests},\n        {label:'Preparation', value:p.prep},\n        {label:'Site', value:site ? site.name + (site.partner ? ' (accredited partner spoke)' : '') : '—'},\n        {label:'Results reviewed by', value:'A registered clinician in ' + provider + ' · results in 48–72 hours'},\n        {label:'Consent', value:'All four statements agreed · consent form to be signed at the appointment'},\n        {label:'Payment', value:'Collected by Everest · £— (placeholder)'}\n      ];\n    }\n    if (st.kind === 'done') {\n      const site = this.siteObj(); const p = this.panelObj();\n      vals.doneLine = p.name + ' at ' + (site ? site.name : 'your chosen site') + '. ' + p.prep + '.';\n    }\n    return vals;\n  }\n\n  optView(label, meta, sel, onPick, danger){\n    const accent = danger ? '#a32d2d' : '#0f6e56';\n    const bg = sel ? (danger ? '#fcebeb' : '#e1f5ee') : '#fff';\n    return {\n      label, meta: meta || '',\n      pick: onPick,\n      style: 'appearance:none;font-family:inherit;text-align:left;width:100%;cursor:pointer;padding:13px 15px;border-radius:10px;background:' + bg\n        + ';border:1.5px solid ' + (sel ? accent : '#dfe0e0') + ';color:#1c1f23',\n      dot: 'flex:0 0 16px;height:16px;border-radius:50%;margin-top:2px;border:1.5px solid ' + (sel ? accent : '#c9cac9')\n        + ';background:' + (sel ? accent : '#fff') + ';box-shadow:' + (sel ? 'inset 0 0 0 3px #fff' : 'none'),\n      metaStyle: 'font-size:12px;line-height:1.5;margin-top:' + (meta ? '3px' : '0') + ';color:' + (danger && sel ? '#a32d2d' : '#6b7280')\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
