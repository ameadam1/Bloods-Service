i-TG<\u002Fstrong> — autoimmune thyroid · serum · Specialist<\u002Fdiv>\n          <div><strong>Total IgE<\u002Fstrong> — atopy, allergy marker · serum · Specialist<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#f2edfa;border-radius:8px;padding:11px 13px;margin-top:12px;font-size:12px;line-height:1.5;color:#4a2f78\">This whole panel is specialist. It is not orderable from the patient portal without a clinical reason recorded on the request.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;align-items:center;gap:14px;margin:30px 0 16px;flex-wrap:wrap\">\n      <div style=\"font-size:11px;font-weight:700;color:#6b7280;text-transform:uppercase;letter-spacing:.06em\">Laboratory catalogue panels<\u002Fdiv>\n      <div style=\"flex:1;height:1px;background:#dfe0e0;min-width:40px\"><\u002Fdiv>\n      <div style=\"font-size:12px;color:#6b7280\">Pre-bundled and pre-priced by the lab · ordered by product code<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px\">\n      <div style=\"background:#fff;border:1px solid #dfe0e0;border-radius:12px;padding:20px 22px\">\n        <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:12px\"><div style=\"font-size:16px;font-weight:600\">11 · Well Woman / Well Man<\u002Fdiv><span style=\"font-size:11px;font-weight:700;padding:3px 10px;border-radius:100px;background:#e1f5ee;color:#0f6e56\">No fasting<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:7px;font-size:13px;line-height:1.5\">\n          <div><strong>FBC, U&amp;E, LFTs<\u002Fstrong> — the standard baseline · EDTA and serum · Core<\u002Fdiv>\n          <div><strong>Bone profile<\u002Fstrong> — calcium, phosphate, ALP, albumin · serum · Core<\u002Fdiv>\n          <div><strong>Lipids &amp; glucose<\u002Fstrong> — metabolic baseline · serum · Core<\u002Fdiv>\n          <div><strong>Ferritin, TSH<\u002Fstrong> — iron stores and thyroid · serum · Core<\u002Fdiv>\n          <div><strong>PSA<\u002Fstrong> — Well Man only, over 50 or symptomatic · serum · Targeted<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#f7f6f2;border-radius:8px;padding:11px 13px;margin-top:12px;font-size:12px;line-height:1.5;color:#6b7280\">Lab offers Premier and Premier Plus tiers. Confirm which tier the booking bought before you draw — the tube list differs.<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"background:#fff;border:1px solid #dfe0e0;border-radius:12px;padding:20px 22px\">\n        <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:12px\"><div style=\"font-size:16px;font-weight:600\">12 · Tiredness &amp; Fatigue<\u002Fdiv><span style=\"font-size:11px;font-weight:700;padding:3px 10px;border-radius:100px;background:#e1f5ee;color:#0f6e56\">No fasting<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:7px;font-size:13px;line-height:1.5\">\n          <div><strong>FBC<\u002Fstrong> — anaemia, infection · EDTA purple · Core<\u002Fdiv>\n          <div><strong>Ferritin, B12, folate<\u002Fstrong> — the three commonest reversible causes · serum · Core<\u002Fdiv>\n          <div><strong>TSH &amp; FT4<\u002Fstrong> — thyroid · serum · Core<\u002Fdiv>\n          <div><strong>Coeliac screen (tTG-IgA)<\u002Fstrong> — must be eating gluten · serum · Targeted<\u002Fdiv>\n          <div><strong>U&amp;E, LFTs, CRP, glucose<\u002Fstrong> — organ and inflammatory causes · serum · Core<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#f7f6f2;border-radius:8px;padding:11px 13px;margin-top:12px;font-size:12px;line-height:1.5;color:#6b7280\">Ask whether they are eating gluten. A coeliac screen on a gluten-free diet is a false negative waiting to happen.<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"background:#fff;border:1px solid #f0c36d;border-radius:12px;padding:20px 22px\">\n        <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:12px\"><div style=\"font-size:16px;font-weight:600\">13 · Weight-loss (GLP-1) monitoring<\u002Fdiv><span style=\"font-size:11px;font-weight:700;padding:3px 10px;border-radius:100px;background:#fff7e6;color:#7a5400\">Fasting · morning<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:7px;font-size:13px;line-height:1.5\">\n          <div><strong>HbA1c<\u002Fstrong> — glycaemic response to treatment · EDTA purple · Core<\u002Fdiv>\n          <div><strong>Lipid profile<\u002Fstrong> — metabolic response · serum · Core<\u002Fdiv>\n          <div><strong>LFTs<\u002Fstrong> — hepatic monitoring on treatment · serum · Core<\u002Fdiv>\n          <div><strong>U&amp;E<\u002Fstrong> — renal function, dehydration risk · serum · Core<\u002Fdiv>\n          <div><strong>TSH<\u002Fstrong> — on the lab's Thyroid variant of the panel · serum · Targeted<\u002Fdiv>\n          <div><strong>Fasting insulin<\u002Fstrong> — insulin resistance · serum, fasting · Targeted<\u002Fdiv>\n          <div><strong>Amylase or lipase<\u002Fstrong> — pancreatitis signal · serum · Specialist<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#fff7e6;border-radius:8px;padding:11px 13px;margin-top:12px;font-size:12px;line-height:1.5;color:#7a5400\">Three lab variants: standard, Advanced, and + Thyroid. Baseline before treatment starts, then at review. Ask about abdominal pain before you draw — it changes the urgency, not the panel.<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"background:#fff;border:1px solid #f0c36d;border-radius:12px;padding:20px 22px\">\n        <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:12px\"><div style=\"font-size:16px;font-weight:600\">14 · PCOS Screen<\u002Fdiv><span style=\"font-size:11px;font-weight:700;padding:3px 10px;border-radius:100px;background:#fff7e6;color:#7a5400\">Cycle day 2–5 · fasting<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:7px;font-size:13px;line-height:1.5\">\n          <div><strong>Testosterone, SHBG, free androgen index<\u002Fstrong> — androgen excess · serum · Specialist<\u002Fdiv>\n          <div><strong>LH &amp; FSH<\u002Fstrong> — the LH:FSH ratio · serum · Specialist<\u002Fdiv>\n          <div><strong>Prolactin, DHEA-S<\u002Fstrong> — excludes other causes · serum · Specialist<\u002Fdiv>\n          <div><strong>TSH<\u002Fstrong> — thyroid mimics the picture · serum · Core<\u002Fdiv>\n          <div><strong>Glucose &amp; insulin<\u002Fstrong> — insulin resistance, fasting · serum · Targeted<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#fff7e6;border-radius:8px;padding:11px 13px;margin-top:12px;font-size:12px;line-height:1.5;color:#7a5400\">Two timing rules at once: early follicular phase and fasting. If she cannot meet both, rebook rather than compromise one.<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"background:#fff;border:1px solid #dfe0e0;border-radius:12px;padding:20px 22px\">\n        <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:12px\"><div style=\"font-size:16px;font-weight:600\">15 · Heart Health Profile<\u002Fdiv><span style=\"font-size:11px;font-weight:700;padding:3px 10px;border-radius:100px;background:#fff7e6;color:#7a5400\">Priority courier<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:7px;font-size:13px;line-height:1.5\">\n          <div><strong>Lipid profile<\u002Fstrong> — total, LDL, HDL, TG, non-HDL · serum · Core<\u002Fdiv>\n          <div><strong>ApoA1 &amp; ApoB<\u002Fstrong> — protective and atherogenic particles · serum · Targeted<\u002Fdiv>\n          <div><strong>Lp(a)<\u002Fstrong> — inherited risk, once in a lifetime · serum · Specialist<\u002Fdiv>\n          <div><strong>hsCRP<\u002Fstrong> — vascular inflammation · serum · Specialist<\u002Fdiv>\n          <div><strong>Homocysteine<\u002Fstrong> — rapid processing required · EDTA · Specialist<\u002Fdiv>\n          <div><strong>HbA1c, U&amp;E<\u002Fstrong> — metabolic and renal context · Core<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#f7f6f2;border-radius:8px;padding:11px 13px;margin-top:12px;font-size:12px;line-height:1.5;color:#6b7280\">Homocysteine is the constraint: it must reach the lab quickly, so this panel is not bookable into a late-afternoon slot.<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"background:#fff;border:1px solid #dfe0e0;border-radius:12px;padding:20px 22px\">\n        <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:12px\"><div style=\"font-size:16px;font-weight:600\">16 · Prostate Profile<\u002Fdiv><span style=\"font-size:11px;font-weight:700;padding:3px 10px;border-radius:100px;background:#fff7e6;color:#7a5400\">48-hour abstinence<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:7px;font-size:13px;line-height:1.5\">\n          <div><strong>Total PSA<\u002Fstrong> — prostate specific antigen · serum · Core<\u002Fdiv>\n          <div><strong>Free PSA<\u002Fstrong> — unbound fraction · serum · Targeted<\u002Fdiv>\n          <div><strong>Free:total ratio<\u002Fstrong> — calculated, aids interpretation · Core<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#fff7e6;border-radius:8px;padding:11px 13px;margin-top:12px;font-size:12px;line-height:1.5;color:#7a5400\">Ask, without embarrassment, about ejaculation, vigorous cycling, a recent DRE, catheter or UTI in the last 48 hours — all raise PSA and all produce a falsely alarming result. If any apply, rebook.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"background:#fff;border:1px solid #dfe0e0;border-radius:12px;padding:20px 22px;margin-top:18px\">\n      <div style=\"font-size:16px;font-weight:600;margin-bottom:10px\">What staff cannot order<\u002Fdiv>\n      <div style=\"font-size:13px;line-height:1.6;color:#6b7280\">No test outside this catalogue, and no addition to a panel after the patient has left. If a patient asks for something not listed — tumour markers, allergy-specific IgE, genetic tests, anything a private clinic advertises — take their name and pass it to the clinical team. Adding a tube “while they're here” bypasses consent, pricing and the clinical appropriateness check, and the laboratory will reject an unrequested sample anyway.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isWorkflow }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"max-width:1400px;margin:0 auto;padding:28px 24px 80px\">\n    <div style=\"display:flex;gap:28px;align-items:flex-end;flex-wrap:wrap;margin-bottom:22px\">\n      <div style=\"flex:1;min-width:280px\">\n        <div style=\"font-size:24px;font-weight:600;margin-bottom:6px\">End-to-end workflow<\u002Fdiv>\n        <div style=\"font-size:14px;color:#6b7280;line-height:1.6;max-width:640px\">Nine stages, four actors. The vertical line after stage 4 is the regulatory boundary: everything left of it is GPhC-governed pharmacy activity at the spoke, everything right of it is Everest's CQC-registered clinical activity. Same company, two registrations — the line still has to be absolute.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:14px;flex-wrap:wrap\">\n        <div style=\"display:flex;align-items:center;gap:7px;font-size:12px;color:#6b7280\"><span style=\"width:12px;height:12px;border-radius:3px;background:#0f6e56\"><\u002Fspan>Patient<\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:7px;font-size:12px;color:#6b7280\"><span style=\"width:12px;height:12px;border-radius:3px;background:#102a43\"><\u002Fspan>Pharmacy (spoke)<\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:7px;font-size:12px;color:#6b7280\"><span style=\"width:12px;height:12px;border-radius:3px;background:#7a5400\"><\u002Fspan>Laboratory<\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:7px;font-size:12px;color:#6b7280\"><span style=\"width:12px;height:12px;border-radius:3px;background:#5b3d8c\"><\u002Fspan>Everest clinical team (CQC)<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"background:#fff;border:1px solid #dfe0e0;border-radius:12px;padding:18px;overflow-x:auto\">\n      <div style=\"min-width:1500px;display:grid;grid-template-columns:150px repeat(9,1fr);gap:8px\">\n\n        <div style=\"grid-column:1;grid-row:1\"><\u002Fdiv>\n        <div style=\"grid-column:2;grid-row:1;font-size:11px;font-weight:700;color:#6b7280;text-transform:uppercase;letter-spacing:.04em;padding:0 4px 6px\">1 · Booking<\u002Fdiv>\n        <div style=\"grid-column:3;grid-row:1;font-size:11px;font-weight:700;color:#6b7280;text-transform:uppercase;letter-spacing:.04em;padding:0 4px 6px\">2 · Arrival &amp; consent<\u002Fdiv>\n        <div style=\"grid-column:4;grid-row:1;font-size:11px;font-weight:700;color:#6b7280;text-transform:uppercase;letter-spacing:.04em;padding:0 4px 6px\">3 · Venepuncture<\u002Fdiv>\n        <div style=\"grid-column:5;grid-row:1;font-size:11px;font-weight:700;color:#6b7280;text-transform:uppercase;letter-spacing:.04em;padding:0 4px 6px\">4 · Dispatch<\u002Fdiv>\n        <div style=\"grid-column:6;grid-row:1;font-size:11px;font-weight:700;color:#6b7280;text-transform:uppercase;letter-spacing:.04em;padding:0 4px 6px\">5 · Analysis<\u002Fdiv>\n        <div style=\"grid-column:7;grid-row:1;font-size:11px;font-weight:700;color:#6b7280;text-transform:uppercase;letter-spacing:.04em;padding:0 4px 6px\">6 · Clinical review<\u002Fdiv>\n        <div style=\"grid-column:8;grid-row:1;font-size:11px;font-weight:700;color:#6b7280;text-transform:uppercase;letter-spacing:.04em;padding:0 4px 6px\">7 · Results<\u002Fdiv>\n        <div style=\"grid-column:9;grid-row:1;font-size:11px;font-weight:700;color:#6b7280;text-transform:uppercase;letter-spacing:.04em;padding:0 4px 6px\">8 · Escalation<\u002Fdiv>\n        <div style=\"grid-column:10;grid-row:1;font-size:11px;font-weight:700;color:#6b7280;text-transform:uppercase;letter-spacing:.04em;padding:0 4px 6px\">9 · Follow-up<\u002Fdiv>\n\n        <div style=\"grid-column:1;grid-row:2;display:flex;align-items:center;font-size:12.5px;font-weight:700;color:#0f6e56;border-left:3px solid #0f6e56;padding-left:10px\">Patient<\u002Fdiv>\n        <div style=\"grid-column:2;grid-row:2;background:#e1f5ee;border:1px solid #b9e3d2;border-radius:8px;padding:11px 12px;font-size:12.5px;line-height:1.45;color:#0c5c47\">Books online, answers screening, consents, pays<\u002Fdiv>\n        <div style=\"grid-column:3;grid-row:2;background:#e1f5ee;border:1px solid #b9e3d2;border-radius:8px;padding:11px 12px;font-size:12.5px;line-height:1.45;color:#0c5c47\">Attends with ID, signs consent<\u002Fdiv>\n        <div style=\"grid-column:4;grid-row:2;background:#e1f5ee;border:1px solid #b9e3d2;border-radius:8px;padding:11px 12px;font-size:12.5px;line-height:1.45;color:#0c5c47\">Blood taken, aftercare advice given<\u002Fdiv>\n        <div style=\"grid-column:8;grid-row:2;background:#e1f5ee;border:1px solid #b9e3d2;border-radius:8px;padding:11px 12px;font-size:12.5px;line-height:1.45;color:#0c5c47\">Receives result plus written interpretation in portal<\u002Fdiv>\n        <div style=\"grid-column:9;grid-row:2;background:#e1f5ee;border:1px solid #b9e3d2;border-radius:8px;padding:11px 12px;font-size:12.5px;line-height:1.45;color:#0c5c47\">Takes clinician call, acts on advice<\u002Fdiv>\n        <div style=\"grid-column:10;grid-row:2;background:#e1f5ee;border:1px solid #b9e3d2;border-radius:8px;padding:11px 12px;font-size:12.5px;line-height:1.45;color:#0c5c47\">Rebooks monitoring test if advised<\u002Fdiv>\n\n        <div style=\"grid-column:1;grid-row:3;display:flex;align-items:center;font-size:12.5px;font-weight:700;color:#102a43;border-left:3px solid #102a43;padding-left:10px\">Pharmacy (spoke)<\u002Fdiv>\n        <div style=\"grid-column:2;grid-row:3;background:#eef3f8;border:1px solid #cbd9e6;border-radius:8px;padding:11px 12px;font-size:12.5px;line-height:1.45;color:#102a43\">Screening result recorded · slot released · PIL sent · payment collected on behalf of provider<\u002Fdiv>\n        <div style=\"grid-column:3;grid-row:3;background:#eef3f8;border:1px solid #cbd9e6;border-radius:8px;padding:11px 12px;font-size:12.5px;line-height:1.45;color:#102a43\">ID verified · consent witnessed · patient told Everest is the registered provider and will contact them · face-to-face eligibility re-check<\u002Fdiv>\n        <div style=\"grid-column:4;grid-row:3;background:#eef3f8;border:1px solid #cbd9e6;border-radius:8px;padding:11px 12px;font-size:12.5px;line-height:1.45;color:#102a43\">Max 2 attempts · tubes labelled at the chair · scanned to the request<\u002Fdiv>\n        <div style=\"grid-column:5;grid-row:3;background:#eef3f8;border:1px solid #cbd9e6;border-radius:8px;padding:11px 12px;font-size:12.5px;line-height:1.45;color:#102a43\">UN3373 packing · 2–8°C hold · courier signs the chain of custody<\u002Fdiv>\n        <div style=\"grid-column:10;grid-row:3;background:#eef3f8;border:1px solid #cbd9e6;border-radius:8px;padding:11px 12px;font-size:12.5px;line-height:1.45;color:#102a43\">Non-clinical follow-up only — every clinical question redirected to the clinical team<\u002Fdiv>\n\n        <div style=\"grid-column:1;grid-row:4;display:flex;align-items:center;font-size:12.5px;font-weight:700;color:#7a5400;border-left:3px solid #7a5400;padding-left:10px\">Laboratory<\u002Fdiv>\n        <div style=\"grid-column:6;grid-row:4;background:#fff7e6;border:1px solid #f0c36d;border-radius:8px;padding:11px 12px;font-size:12.5px;line-height:1.45;color:#7a5400\">UKAS ISO 15189 analysis · rejection notice back to branch within SLA<\u002Fdiv>\n        <div style=\"grid-column:7;grid-row:4;background:#fff7e6;border:1px solid #f0c36d;border-radius:8px;padding:11px 12px;font-size:12.5px;line-height:1.45;color:#7a5400\">Results to the clinical team by HL7/API · critical values phoned, not just flagged<\u002Fdiv>\n\n        <div style=\"grid-column:1;grid-row:5;display:flex;align-items:center;font-size:12.5px;font-weight:700;color:#5b3d8c;border-left:3px solid #5b3d8c;padding-left:10px\">Everest clinical<br>team (CQC)<\u002Fdiv>\n        <div style=\"grid-column:7;grid-row:5;background:#f2edfa;border:1px solid #d5c7ee;border-radius:8px;padding:11px 12px;font-size:12.5px;line-height:1.45;color:#4a2f78\">HCP reviews every result · categorises normal / borderline / abnormal / critical · opens clinical record<\u002Fdiv>\n        <div style=\"grid-column:8;grid-row:5;background:#f2edfa;border:1px solid #d5c7ee;border-radius:8px;padding:11px 12px;font-size:12.5px;line-height:1.45;color:#4a2f78\">Plain-language interpretation released · safety-netting documented within 30 minutes<\u002Fdiv>\n        <div style=\"grid-column:9;grid-row:5;background:#f2edfa;border:1px solid #d5c7ee;border-radius:8px;padding:11px 12px;font-size:12.5px;line-height:1.45;color:#4a2f78\">Critical: call within 1 hour, 3 attempts, GP letter, 999 if uncontactable and life-threatening<\u002Fdiv>\n        <div style=\"grid-column:10;grid-row:5;background:#f2edfa;border:1px solid #d5c7ee;border-radius:8px;padding:11px 12px;font-size:12.5px;line-height:1.45;color:#4a2f78\">Owns the clinical record · closes the episode · reports KPIs to the governance board<\u002Fdiv>\n\n        <div style=\"grid-column:1;grid-row:6;display:flex;align-items:center;font-size:12.5px;font-weight:700;color:#6b7280;border-left:3px solid #dfe0e0;padding-left:10px\">Systems<\u002Fdiv>\n        <div style=\"grid-column:2;grid-row:6;grid-column-end:6;background:#f7f6f2;border:1px dashed #c9cac9;border-radius:8px;padding:11px 12px;font-size:12px;line-height:1.5;color:#6b7280\">Everest portal — booking, screening record, consent, barcode label print, courier manifest. Pharmacy-side data only; no result fields exist in this schema.<\u002Fdiv>\n        <div style=\"grid-column:6;grid-row:6;background:#f7f6f2;border:1px dashed #c9cac9;border-radius:8px;padding:11px 12px;font-size:12px;line-height:1.5;color:#6b7280\">Lab LIMS<\u002Fdiv>\n        <div style=\"grid-column:7;grid-row:6;grid-column-end:11;background:#f7f6f2;border:1px dashed #c9cac9;border-radius:8px;padding:11px 12px;font-size:12px;line-height:1.5;color:#6b7280\">Everest clinical system (CQC-registered service) — result store, interpretation, GP correspondence, escalation log, audit trail. Branch and partner staff hold no account on this system.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin-top:20px\">\n      <div style=\"background:#fff;border:1px solid #dfe0e0;border-radius:12px;padding:18px 20px\">\n        <div style=\"font-size:11px;font-weight:700;color:#6b7280;text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px\">The one-way valve<\u002Fdiv>\n        <div style=\"font-size:13.5px;line-height:1.6\">Results travel lab → clinical team → patient. They never route through the collecting site. Enforced by role-based access, not by training: the branch console has no field that can hold a result value, even for an Everest branch.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#fff;border:1px solid #dfe0e0;border-radius:12px;padding:18px 20px\">\n        <div style=\"font-size:11px;font-weight:700;color:#6b7280;text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px\">Clocks that matter<\u002Fdiv>\n        <div style=\"font-size:13.5px;line-height:1.6\">Sample to lab: same day. Result to patient: 48–72 hours. Critical value to clinician call: 1 hour. Sample rejection rate: under 2%. Each has an owner in the lane above it.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#fff;border:1px solid #dfe0e0;border-radius:12px;padding:18px 20px\">\n        <div style=\"font-size:11px;font-weight:700;color:#6b7280;text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px\">Where it breaks<\u002Fdiv>\n        <div style=\"font-size:13.5px;line-height:1.6\">Three failure points carry the most risk: mislabelling at stage 3, cold-chain or courier delay at stage 4, and an uncontactable patient at stage 9. All three have a flowchart in the staff guide.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isConsole }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"max-width:1400px;margin:0 auto;padding:28px 24px 80px\">\n    <div style=\"margin-bottom:22px\">\n      <div style=\"font-size:24px;font-weight:600;margin-bottom:6px\">Ops console<\u002Fdiv>\n      <div style=\"font-size:14px;color:#6b7280;line-height:1.6;max-width:720px\">What branch staff see. Queues are ordered by what goes wrong if they are left: unreviewed bookings, samples not yet handed to a courier, results waiting on a clinician.<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap\">\n      <div style=\"flex:0 0 250px;min-width:220px;background:#fff;border:1px solid #dfe0e0;border-radius:12px;padding:14px\">\n        <div style=\"font-size:11px;font-weight:700;color:#6b7280;text-transform:uppercase;letter-spacing:.05em;padding:4px 8px 10px\">Whalley Range<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:4px\">\n          <sc-for list=\"{{ consoleTabs }}\" as=\"t\" hint-placeholder-count=\"5\">\n            <button type=\"button\" sc-camel-on-click=\"{{ t.go }}\" style=\"{{ t.style }}\"><span>{{ t.label }}<\u002Fspan><span style=\"{{ t.countStyle }}\">{{ t.count }}<\u002Fspan><\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"border-top:1px solid #dfe0e0;margin:14px 0 0;padding-top:14px;display:flex;flex-direction:column;gap:9px\">\n          <div style=\"display:flex;justify-content:space-between;font-size:12px\"><span style=\"color:#6b7280\">Fridge 07:40<\u002Fspan><span style=\"font-weight:600;color:#0f6e56\">4.1°C<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;justify-content:space-between;font-size:12px\"><span style=\"color:#6b7280\">Emergency kit<\u002Fspan><span style=\"font-weight:600;color:#0f6e56\">In date<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;justify-content:space-between;font-size:12px\"><span style=\"color:#6b7280\">Courier collection<\u002Fspan><span style=\"font-weight:600\">16:30<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;justify-content:space-between;font-size:12px\"><span style=\"color:#6b7280\">Competent staff on site<\u002Fspan><span style=\"font-weight:600\">2<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"margin-top:14px;background:#fcebeb;border:1px solid #f0cdcd;border-radius:8px;padding:10px 12px;font-size:11.5px;line-height:1.5;color:#a32d2d\">This console holds no result values. Clinical queries go to the clinical team service desk.<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"flex:1;min-width:320px\">\n\n        <sc-if value=\"{{ isToday }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"background:#fff;border:1px solid #dfe0e0;border-radius:12px;padding:20px 22px\">\n            <div style=\"display:flex;justify-content:space-between;align-items:baseline;margin-bottom:16px;flex-wrap:wrap;gap:8px\">\n              <div style=\"font-size:17px;font-weight:600\">Today — Thursday<\u002Fdiv>\n              <div style=\"font-size:12px;color:#6b7280\">7 booked · 1 provisional · utilisation 78%<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column\">\n              <div style=\"display:flex;gap:14px;padding:12px 0;border-bottom:1px solid #dfe0e0;align-items:center;flex-wrap:wrap\">\n                <div style=\"flex:0 0 52px;font-size:13px;font-weight:700\">09:20<\u002Fdiv>\n                <div style=\"flex:1;min-width:160px\"><div style=\"font-size:13.5px;font-weight:600\">A. Nasir · 41<\u002Fdiv><div style=\"font-size:12px;color:#6b7280\">General Health Screen · no fasting<\u002Fdiv><\u002Fdiv>\n                <span style=\"display:inline-block;padding:3px 10px;border-radius:100px;font-size:11px;font-weight:600;background:#e1f5ee;color:#0f6e56\">Consent signed<\u002Fspan>\n                <button type=\"button\" style=\"font-size:12.5px;padding:6px 12px;border-radius:6px;border:1px solid #dfe0e0;background:#fff;color:#102a43;cursor:pointer;font-family:inherit\" style-hover=\"background:#f1f1f1\">Print labels<\u002Fbutton>\n              <\u002Fdiv>\n              <div style=\"display:flex;gap:14px;padding:12px 0;border-bottom:1px solid #dfe0e0;align-items:center;flex-wrap:wrap\">\n                <div style=\"flex:0 0 52px;font-size:13px;font-weight:700\">09:40<\u002Fdiv>\n                <div style=\"flex:1;min-width:160px\"><div style=\"font-size:13.5px;font-weight:600\">J. Okafor · 58<\u002Fdiv><div style=\"font-size:12px;color:#6b7280\">Hormones &amp; Endocrinology · cortisol, draw before 09:00<\u002Fdiv><\u002Fdiv>\n                <span style=\"display:inline-block;padding:3px 10px;border-radius:100px;font-size:11px;font-weight:600;background:#fff7e6;color:#7a5400\">Timing conflict<\u002Fspan>\n                <button type=\"button\" style=\"font-size:12.5px;padding:6px 12px;border-radius:6px;border:1px solid #dfe0e0;background:#fff;color:#102a43;cursor:pointer;font-family:inherit\" style-hover=\"background:#f1f1f1\">Rebook<\u002Fbutton>\n              <\u002Fdiv>\n              <div style=\"display:flex;gap:14px;padding:12px 0;border-bottom:1px solid #dfe0e0;align-items:center;flex-wrap:wrap\">\n                <div style=\"flex:0 0 52px;font-size:13px;font-weight:700\">10:20<\u002Fdiv>\n                <div style=\"flex:1;min-width:160px\"><div style=\"font-size:13.5px;font-weight:600\">S. Whitfield · 66<\u002Fdiv><div style=\"font-size:12px;color:#6b7280\">Cardiovascular Risk · on apixaban<\u002Fdiv><\u002Fdiv>\n                <span style=\"display:inline-block;padding:3px 10px;border-radius:100px;font-size:11px;font-weight:600;background:#f2edfa;color:#5b3d8c\">Clinically reviewed — proceed<\u002Fspan>\n                <button type=\"button\" style=\"font-size:12.5px;padding:6px 12px;border-radius:6px;border:1px solid #dfe0e0;background:#fff;color:#102a43;cursor:pointer;font-family:inherit\" style-hover=\"background:#f1f1f1\">Open<\u002Fbutton>\n              <\u002Fdiv>\n              <div style=\"display:flex;gap:14px;padding:12px 0;align-items:center;flex-wrap:wrap\">\n                <div style=\"flex:0 0 52px;font-size:13px;font-weight:700\">11:00<\u002Fdiv>\n                <div style=\"flex:1;min-width:160px\"><div style=\"font-size:13.5px;font-weight:600\">R. Deol · 29<\u002Fdiv><div style=\"font-size:12px;color:#6b7280\">Diabetes Monitoring · fasting confirmed by SMS<\u002Fdiv><\u002Fdiv>\n                <span style=\"display:inline-block;padding:3px 10px;border-radius:100px;font-size:11px;font-weight:600;background:#f1f1f0;color:#6b7280\">Awaiting arrival<\u002Fspan>\n                <button type=\"button\" style=\"font-size:12.5px;padding:6px 12px;border-radius:6px;border:1px solid #dfe0e0;background:#fff;color:#102a43;cursor:pointer;font-family:inherit\" style-hover=\"background:#f1f1f1\">Check in<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background:#fff;border:1px solid #dfe0e0;border-radius:12px;padding:20px 22px;margin-top:16px\">\n            <div style=\"font-size:15px;font-weight:600;margin-bottom:4px\">Appointment worksheet — A. Nasir, 09:20<\u002Fdiv>\n            <div style=\"font-size:12.5px;color:#6b7280;margin-bottom:16px\">Each tick is written to the record with a timestamp and the staff member's ID. The appointment cannot be closed with an open step.<\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px\">\n              <div style=\"border:1px solid #b9e3d2;background:#e1f5ee;border-radius:8px;padding:11px 13px;font-size:12.5px;color:#0c5c47;line-height:1.45\"><strong>1 · Identity<\u002Fstrong><br>Name, DOB, address confirmed<\u002Fdiv>\n              <div style=\"border:1px solid #b9e3d2;background:#e1f5ee;border-radius:8px;padding:11px 13px;font-size:12.5px;color:#0c5c47;line-height:1.45\"><strong>2 · Consent<\u002Fstrong><br>Signed, witnessed, copy offered<\u002Fdiv>\n              <div style=\"border:1px solid #b9e3d2;background:#e1f5ee;border-radius:8px;padding:11px 13px;font-size:12.5px;color:#0c5c47;line-height:1.45\"><strong>3 · Eligibility re-check<\u002Fstrong><br>Face-to-face, no new red flags<\u002Fdiv>\n              <div style=\"border:1px solid #dfe0e0;border-radius:8px;padding:11px 13px;font-size:12.5px;line-height:1.45\"><strong>4 · Tubes<\u002Fstrong><br>EDTA ×1, serum ×2 — scan to match<\u002Fdiv>\n              <div style=\"border:1px solid #dfe0e0;border-radius:8px;padding:11px 13px;font-size:12.5px;line-height:1.45\"><strong>5 · Venepuncture<\u002Fstrong><br>Site, gauge, attempts (max 2)<\u002Fdiv>\n              <div style=\"border:1px solid #dfe0e0;border-radius:8px;padding:11px 13px;font-size:12.5px;line-height:1.45\"><strong>6 · Aftercare<\u002Fstrong><br>Advice leaflet issued, patient observed<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isReviewQ }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"background:#fff;border:1px solid #dfe0e0;border-radius:12px;padding:20px 22px\">\n            <div style=\"font-size:17px;font-weight:600;margin-bottom:4px\">Pre-booking review<\u002Fdiv>\n            <div style=\"font-size:12.5px;color:#6b7280;line-height:1.55;margin-bottom:18px\">Screening answers that need a clinician before a slot is confirmed. The patient holds a provisional slot and has been told it is provisional. Pharmacy staff can read the answers but cannot clear the flag.<\u002Fdiv>\n            <div style=\"border:1px solid #d5c7ee;background:#f2edfa;border-radius:10px;padding:16px;margin-bottom:12px\">\n              <div style=\"display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:8px\">\n                <div style=\"font-size:14px;font-weight:600;color:#4a2f78\">S. Whitfield · 66 · Cardiovascular Risk<\u002Fdiv>\n                <div style=\"font-size:11px;font-weight:700;color:#5b3d8c\">Clinical decision required<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"font-size:13px;line-height:1.6;color:#4a2f78\">Declared: apixaban, and a bruise lasting over a week after a previous test. Provisional slot Thu 10:20.<\u002Fdiv>\n              <div style=\"font-size:12px;color:#5b3d8c;margin-top:8px\">Decision recorded 07:52 — proceed with 5-minute pressure and extended observation. Note printed on the branch worksheet.<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"border:1px solid #f0c36d;background:#fff7e6;border-radius:10px;padding:16px\">\n              <div style=\"display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:8px\">\n                <div style=\"font-size:14px;font-weight:600;color:#7a5400\">M. Bright · 34 · Thyroid Function<\u002Fdiv>\n                <div style=\"font-size:11px;font-weight:700;color:#7a5400\">Waiting 4h 12m<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"font-size:13px;line-height:1.6;color:#7a5400\">Declared: severe needle phobia, fainted at last two tests. Options offered by the system: supported appointment with extended slot, or GP referral. No slot released yet.<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isSamples }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"background:#fff;border:1px solid #dfe0e0;border-radius:12px;padding:20px 22px\">\n            <div style=\"font-size:17px;font-weight:600;margin-bottom:4px\">Samples &amp; chain of custody<\u002Fdiv>\n            <div style=\"font-size:12.5px;color:#6b7280;line-height:1.55;margin-bottom:18px\">Every tube is scanned four times: at labelling, into the fridge, into the courier bag, and at lab receipt. A missing scan is an open incident, not a gap in a spreadsheet.<\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:12px\">\n              <div style=\"border:1px solid #dfe0e0;border-radius:10px;padding:14px 16px\">\n                <div style=\"display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:10px\">\n                  <div style=\"font-family:ui-monospace,monospace;font-size:13px;font-weight:600\">WR-26-0918-004<\u002Fdiv>\n                  <span style=\"display:inline-block;padding:3px 10px;border-radius:100px;font-size:11px;font-weight:600;background:#e1f5ee;color:#0f6e56\">At laboratory<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"display:flex;gap:0;flex-wrap:wrap\">\n                  <div style=\"flex:1;min-width:110px;border-top:3px solid #0f6e56;padding-top:8px;margin-right:8px\"><div style=\"font-size:11px;font-weight:700;color:#0f6e56\">09:31 Labelled<\u002Fdiv><div style=\"font-size:11.5px;color:#6b7280\">At the chair · KB<\u002Fdiv><\u002Fdiv>\n                  <div style=\"flex:1;min-width:110px;border-top:3px solid #0f6e56;padding-top:8px;margin-right:8px\"><div style=\"font-size:11px;font-weight:700;color:#0f6e56\">09:44 Fridge<\u002Fdiv><div style=\"font-size:11.5px;color:#6b7280\">4.1°C · KB<\u002Fdiv><\u002Fdiv>\n                  <div style=\"flex:1;min-width:110px;border-top:3px solid #0f6e56;padding-top:8px;margin-right:8px\"><div style=\"font-size:11px;font-weight:700;color:#0f6e56\">16:34 Courier<\u002Fdiv><div style=\"font-size:11.5px;color:#6b7280\">Custody signed<\u002Fdiv><\u002Fdiv>\n                  <div style=\"flex:1;min-width:110px;border-top:3px solid #0f6e56;padding-top:8px\"><div style=\"font-size:11px;font-weight:700;color:#0f6e56\">18:02 Received<\u002Fdiv><div style=\"font-size:11.5px;color:#6b7280\">Lab scan · intact<\u002Fdiv><\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"border:1px solid #f0cdcd;background:#fcebeb;border-radius:10px;padding:14px 16px\">\n                <div style=\"display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:8px\">\n                  <div style=\"font-family:ui-monospace,monospace;font-size:13px;font-weight:600;color:#a32d2d\">WR-26-0918-007<\u002Fdiv>\n                  <span style=\"display:inline-block;padding:3px 10px;border-radius:100px;font-size:11px;font-weight:600;background:#fff;color:#a32d2d;border:1px solid #f0cdcd\">Quarantined — do not dispatch<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"font-size:13px;line-height:1.6;color:#a32d2d\">Label mismatch found at the fridge scan: tube barcode does not match the request. Sample held and marked DO NOT USE.<\u002Fdiv>\n                <div style=\"font-size:12.5px;line-height:1.6;color:#7c2626;margin-top:8px\">Next actions forced by the system: contact patient (duty of candour) → apologise → priority re-collection offered → dispose as clinical waste with witness → Rejection and incident records opened → clinical team notified that no result can be issued.<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"border:1px solid #f0c36d;background:#fff7e6;border-radius:10px;padding:14px 16px\">\n                <div style=\"display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:8px\">\n                  <div style=\"font-family:ui-monospace,monospace;font-size:13px;font-weight:600;color:#7a5400\">AS-26-0918-002 · partner site<\u002Fdiv>\n                  <span style=\"display:inline-block;padding:3px 10px;border-radius:100px;font-size:11px;font-weight:600;background:#fff;color:#7a5400;border:1px solid #f0c36d\">Courier 41 min late<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"font-size:13px;line-height:1.6;color:#7a5400\">Kingsway Pharmacy, Ashton. Sample within 2–8°C hold window for a further 3h 20m. Escalation to courier contract manager auto-raised at 60 minutes.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isResultsQueue }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"background:#f2edfa;border:1px solid #d5c7ee;border-radius:12px;padding:14px 16px;margin-bottom:14px;font-size:12.5px;line-height:1.6;color:#4a2f78\">\n            <strong>Clinical team view.<\u002Fstrong> This queue belongs to Everest's CQC-registered service and is not visible from any branch or partner login. It is shown here so the whole workflow can be reviewed in one place.\n          <\u002Fdiv>\n          <div style=\"background:#fff;border:1px solid #dfe0e0;border-radius:12px;padding:20px 22px\">\n            <div style=\"font-size:17px;font-weight:600;margin-bottom:4px\">Results awaiting clinician review<\u002Fdiv>\n            <div style=\"font-size:12.5px;color:#6b7280;line-height:1.55;margin-bottom:18px\">Sorted by clinical urgency, then by age against the 48–72 hour standard. Nothing reaches a patient until a named registered clinician has signed the interpretation.<\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column\">\n              <div style=\"display:flex;gap:14px;padding:13px 0;border-bottom:1px solid #dfe0e0;align-items:center;flex-wrap:wrap\">\n                <span style=\"display:inline-block;padding:3px 10px;border-radius:100px;font-size:11px;font-weight:700;background:#fcebeb;color:#a32d2d\">Critical<\u002Fspan>\n                <div style=\"flex:1;min-width:180px\"><div style=\"font-size:13.5px;font-weight:600\">K⁺ 6.8 mmol :700;color:#0f6e56\">08:12<\u002Fdiv><div style=\"flex:1;min-width:200px;font-size:13px;line-height:1.55\">Laboratory telephoned the duty clinician. Caller, recipient and value recorded automatically.<\u002Fdiv><\u002Fdiv>\n              <div style=\"display:flex;gap:14px;padding:12px 0;border-bottom:1px solid #dfe0e0;flex-wrap:wrap\"><div style=\"flex:0 0 66px;font-size:12px;font-weight:700;color:#0f6e56\">08:19<\u002Fdiv><div style=\"flex:1;min-width:200px;font-size:13px;line-height:1.55\">Clinician reviewed in context: on ramipril and spironolactone. Judged immediately life-threatening.<\u002Fdiv><\u002Fdiv>\n              <div style=\"display:flex;gap:14px;padding:12px 0;border-bottom:1px solid #dfe0e0;flex-wrap:wrap\"><div style=\"flex:0 0 66px;font-size:12px;font-weight:700;color:#a32d2d\">08:24<\u002Fdiv><div style=\"flex:1;min-width:200px;font-size:13px;line-height:1.55\">Call attempt 1 — mobile, no answer. Attempt 2 — landline, no answer. Third attempt and emergency contact pending.<\u002Fdiv><\u002Fdiv>\n              <div style=\"display:flex;gap:14px;padding:12px 0;border-bottom:1px solid #dfe0e0;flex-wrap:wrap\"><div style=\"flex:0 0 66px;font-size:12px;font-weight:700;color:#6b7280\">Next<\u002Fdiv><div style=\"flex:1;min-width:200px;font-size:13px;line-height:1.55\">If uncontactable after 3 attempts: escalate to Clinical Lead, consider welfare check, call 999 with the patient's address. GP letter within 24 hours regardless of outcome.<\u002Fdiv><\u002Fdiv>\n              <div style=\"display:flex;gap:14px;padding:12px 0;flex-wrap:wrap\"><div style=\"flex:0 0 66px;font-size:12px;font-weight:700;color:#6b7280\">Then<\u002Fdiv><div style=\"flex:1;min-width:200px;font-size:13px;line-height:1.55\">An incident record is completed, case presented at governance, learning shared with the collecting site at quarterly review. The site is told an escalation occurred — never the value.<\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"displa olor:#6b7280;text-transform:uppercase;letter-spacing:.04em;margin-bottom:12px\">Who wrote what<\u002Fdiv>\n            <div style=\"font-size:13px;line-height:1.6;color:#6b7280\">Only a registered clinician can author or sign an interpretation. Clinical support staff can record a contact but cannot create, alter or extend clinical content — the call note above stays inside the signed plan, and the system will not let it do otherwise.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background:#fff;border:1px solid #dfe0e0;border-radius:12px;padding:18px 20px\">\n            <div style=\"font-size:11px;font-weight:700;color:#6b7280;text-transform:uppercase;letter-spacing:.04em;margin-bottom:12px\">Access log<\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:9px;font-size:12.5px;line-height:1.5;color:#6b7280\">\n              <div>19 Sep 08:22 · Dr [name] · opened record<\u002Fdiv>\n              <div>19 Sep 11:18 · A. Reyes · opened record<\u002Fdiv>\n              <div>19 Sep 14:02 · Patient · portal view<\u002Fdiv>\n              <div style=\"border-top:1px solid #dfe0e0;padding-top:9px;color:#1c1f23\">Every access is logged and auditable. No pharmacy or partner account appears in this log, because none can reach the record.<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ rLetter }}\" hint-placeholder-val=\"{{ false }}\">\n      <div class=\"noprint\" style=\"display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;align-items:center\">\n        <button type=\"button\" style=\"font-size:13px;padding:9px 16px;border-radius:6px;border:none;background:#0f6e56;color:#fff;font-weight:600;cursor:pointer;font-family:inherit\">Send to GP practice<\u002Fbutton>\n        <button type=\"button\" style=\"font-size:13px;padding:9px 16px;border-radius:6px;border:1px solid #dfe0e0;background:#fff;color:#102a43;font-weight:600;cursor:pointer;font-family:inherit\" style-hover=\"background:#f1f1f1\">Copy to patient<\u002Fbutton>\n        <div style=\"font-size:12px;color:#6b7280\">GP letter · generated from the signed interpretation · sent 19 Sep 08:47<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"a4\" style=\"width:100%;max-width:794px;margin:0 auto;background:#fff;border:1px solid #dfe0e0;border-radius:6px;padding:52px 56px;box-shadow:0 2px 10px rgba(16,42,67,.07)\">\n        <div style=\"display:flex;justify-content:space-between;align-items:flex-start;gap:24px;border-bottom:2px solid #102a43;padding-bottom:18px;margin-bottom:26px;flex-wrap:wrap\">\n          <img src=\"4f2b3abd-a825-4e59-9335-2b43a570a10a\" alt=\"Everest Pharmacy\" style=\"height:46px;width:auto;display:block;align-self:flex-start\">\n          <div style=\"text-align:right;font-size:11.5px;line-height:1.6;color:#6b7280\">\n            Everest Clinical Services<br>CQC provider ID [number]<br>[address line]<br>clinical@[domain] · [telephone]\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;justify-content:space-between;gap:24px;margin-bottom:26px;flex-wrap:wrap\">\n          <div style=\"font-size:13px;line-height:1.65\">\n            <strong>Chorlton Family Practice<\u002Fstrong><br>\n            [practice address]<br>\n            <span style=\"color:#6b7280\">Sent by secure electronic mail<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"font-size:13px;line-height:1.65;text-align:right\">\n            19 September 2026<br>\n            <span style=\"color:#6b7280\">Our ref: EP-26-0918-004<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"background:#f7f6f2;border:1px solid #dfe0e0;border-radius:8px;padding:16px 18px;margin-bottom:24px;font-size:13px;line-height:1.7\">\n          <strong>Patient:<\u002Fstrong> Amira Nasir · DOB 14 March 1985 · NHS 943 476 5919<br>\n          <strong>Address:<\u002Fstrong> 12 Brantwood Road, Manchester M16<br>\n          <strong>Sample taken:<\u002Fstrong> 17 September 2026, Everest Pharmacy Whalley Range\n        <\u002Fdiv>\n\n        <div style=\"font-size:15px;font-weight:700;margin-bottom:16px\">Re: Private blood test results — iron deficiency without anaemia, and mildly raised LDL cholesterol<\u002Fdiv>\n\n        <div style=\"font-size:13.5px;line-height:1.75;margin-bottom:16px\">Dear Colleague,<\u002Fdiv>\n\n        <div style=\"font-size:13.5px;line-height:1.75;margin-bottom:16px\">Your patient attended one of our pharmacy sites on 17 September 2026 for a privately funded General Health Screen, which she arranged herself. I have reviewed the results and am writing to share two findings that I believe warrant your attention. She has consented to this disclosure.<\u002Fdiv>\n\n        <div style=\"font-size:13.5px;font-weight:700;margin-bottom:8px\">Findings<\u002Fdiv>\n        <div style=\"font-size:13.5px;line-height:1.75;margin-bottom:16px\">\n          Ferritin 8 µg/L (range 30–300), with haemoglobin preserved at 134 g/L and MCV 81 fL. CRP &lt;3 mg/L, so the ferritin is not confounded by inflammation. Of note, her ferritin was 31 µg/L on a comparable panel in March 2026 — the trend suggests ongoing loss rather than an isolated low value. She reports heavy menstrual periods.<br><br>\n          Separately, LDL cholesterol 4.1 mmol/L with total cholesterol 5.8 and HDL 1.4 mmol/L. This is an isolated lipid abnormality; HbA1c, renal and liver function were all normal.\n        <\u002Fdiv>\n\n        <div style=\"font-size:13.5px;font-weight:700;margin-bottom:8px\">Assessment<\u002Fdiv>\n        <div style=\"font-size:13.5px;line-height:1.75;margin-bottom:16px\">Iron deficiency without anaemia, most likely secondary to menorrhagia, though I am not in a position to exclude other sources of loss. I have not initiated iron replacement, as I consider establishing the cause to be the priority and that sits properly with you.<\u002Fdiv>\n\n        <div style=\"font-size:13.5px;font-weight:700;margin-bottom:8px\">Action requested<\u002Fdiv>\n        <div style=\"font-size:13.5px;line-height:1.75;margin-bottom:16px\">\n          I have advised her to make an appointment with you within two weeks to investigate the iron deficiency, and to discuss her lipid result at the same consultation — formal cardiovascular risk assessment requires blood pressure and smoking status, which I do not hold. I have arranged a repeat ferritin and lipid profile at three months and will write again with those results.\n        <\u002Fdiv>\n\n        <div style=\"font-size:13.5px;line-height:1.75;margin-bottom:16px\">She has received a written plain-language interpretation of these results and safety-netting advice, including to contact you sooner if her fatigue worsens or she notices any gastrointestinal bleeding. Full numerical results are attached.<\u002Fdiv>\n\n        <div style=\"font-size:13.5px;line-height:1.75;margin-bottom:24px\">Please contact our clinical team on the number above if you would like to discuss.<\u002Fdiv>\n\n        <div style=\"font-size:13.5px;line-height:1.75\">\n          Yours faithfully,<br><br><br>\n          <strong>Dr [name]<\u002Fstrong><br>\n          [role] · GMC [number]<br>\n          Everest Clinical Services\n        <\u002Fdiv>\n\n        <div style=\"border-top:1px solid #dfe0e0;margin-top:30px;padding-top:14px;font-size:11px;line-height:1.6;color:#6b7280\">\n          Everest Clinical Services is registered with the Care Quality Commission for diagnostic and screening procedures. Samples were collected at a GPhC-registered pharmacy site operating under our clinical governance framework and analysed at a UKAS ISO 15189 accredited laboratory. Enclosure: full laboratory report (2 pages).\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isGuide }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"max-width:1400px;margin:0 auto;padding:28px 24px 80px\">\n    <div class=\"noprint\" style=\"margin-bottom:22px\">\n      <div style=\"font-size:24px;font-weight:600;margin-bottom:6px\">Staff guide<\u002Fdiv>\n      <div style=\"font-size:14px;color:#6b7280;line-height:1.6;max-width:720px\">Two formats of the same content. On screen: what the phlebotomist checks during an appointment. On paper: the five flowcharts that must be displayed in the clinical room.<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"noprint\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;margin-bottom:34px\">\n      <div style=\"background:#fff;border:1px solid #f0cdcd;border-radius:12px;padding:20px 22px\">\n        <div style=\"font-size:11px;font-weight:700;color:#a32d2d;text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px\">Stop the appointment<\u002Fdiv>\n        <div style=\"font-size:16px;font-weight:600;margin-bottom:12px\">Do not take blood if the patient says any of this today<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:7px;font-size:13.5px;line-height:1.5\">\n          <div>Chest pain, pressure or tightness<\u002Fdiv>\n          <div>Breathlessness at rest<\u002Fdiv>\n          <div>New confusion or drowsiness<\u002Fdiv>\n          <div>Severe abdominal pain<\u002Fdiv>\n          <div>Feels acutely unwell, or fever above 38°C<\u002Fdiv>\n          <div>Bleeding that will not stop<\u002Fdiv>\n          <div>Fainted or collapsed in the last 24 hours<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#fcebeb;border-radius:8px;padding:12px 14px;margin-top:14px;font-size:12.5px;line-height:1.55;color:#a32d2d\"><strong>Then:<\u002Fstrong> advise same-day GP contact, or 999 if life-threatening. Record the symptoms, the advice you gave, the time and your name. Do not offer a rebooking date until they have been seen.<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"background:#fff;border:1px solid #dfe0e0;border-radius:12px;padding:20px 22px\">\n        <div style=\"font-size:11px;font-weight:700;color:#0f6e56;text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px\">Every appointment<\u002Fdiv>\n        <div style=\"font-size:16px;font-weight:600;margin-bottom:12px\">The six things that must be true before the patient leaves<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:9px;font-size:13.5px;line-height:1.5\">\n          <div><strong>1<\u002Fstrong> · Identity confirmed against the booking — name, DOB, address<\u002Fdiv>\n          <div><strong>2<\u002Fstrong> · Consent signed, witnessed, copy offered<\u002Fdiv>\n          <div><strong>3<\u002Fstrong> · Eligibility re-checked face to face<\u002Fdiv>\n          <div><strong>4<\u002Fstrong> · Tubes labelled at the chair, never away from it<\u002Fdiv>\n          <div><strong>5<\u002Fstrong> · Two attempts maximum, then stop and rebook<\u002Fdiv>\n          <div><strong>6<\u002Fstrong> · Aftercare advice given, patient observed before leaving<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#e1f5ee;border-radius:8px;padding:12px 14px;margin-top:14px;font-size:12.5px;line-height:1.55;color:#0c5c47\"><strong>Never:<\u002Fstrong> comment on what a test might show, what a previous result meant, or when results \"usually\" come back as good news.<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"background:#fff;border:1px solid #dfe0e0;border-radius:12px;padding:20px 22px\">\n        <div style=\"font-size:11px;font-weight:700;color:#7a5400;text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px\">When a patient asks about results<\u002Fdiv>\n        <div style=\"font-size:16px;font-weight:600;margin-bottom:12px\">Say this, word for word<\u002Fdiv>\n        <div style=\"background:#f7f6f2;border:1px solid #dfe0e0;border-radius:8px;padding:14px 16px;font-size:14px;line-height:1.65;font-style:italic\">“Your results are reviewed by a clinician in our clinical team, and they will contact you directly to explain them. I'm not able to see or interpret results here at the counter — but I can put you through to them now if you'd like.”<\u002Fdiv>\n        <div style=\"font-size:12.5px;line-height:1.55;color:#6b7280;margin-top:14px\">This is not customer-service politeness. Interpreting a result at the counter is regulated clinical activity. Everest holds that registration as a provider, but this site and this role do not — and this is the single most likely way the service fails an inspection.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"noprint\" style=\"display:flex;align-items:center;gap:14px;margin-bottom:14px;flex-wrap:wrap\">\n      <div style=\"font-size:11px;font-weight:700;color:#6b7280;text-transform:uppercase;letter-spacing:.06em\">Clinical room pack — print at A4<\u002Fdiv>\n      <div style=\"flex:1;height:1px;background:#dfe0e0;min-width:40px\"><\u002Fdiv>\n      <div style=\"font-size:12px;color:#6b7280\">5 sheets · review annually or on SOP change<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;flex-direction:column;gap:24px;align-items:center\">\n\n      <div class=\"a4\" style=\"width:100%;max-width:794px;background:#fff;border:1px solid #dfe0e0;border-radius:6px;padding:46px 44px;box-shadow:0 2px 10px rgba(16,42,67,.07)\">\n        <div style=\"display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid #102a43;padding-bottom:10px;margin-bottom:22px\">\n          <div><div style=\"font-size:19px;font-weight:700\">Flowchart 1 — Patient screening &amp; eligibility<\u002Fdiv><div style=\"font-size:12px;color:#6b7280;margin-top:3px\">Pharmacy (spoke) responsible<\u002Fdiv><\u002Fdiv>\n          <div style=\"font-size:11px;font-weight:700;color:#fff;background:#102a43;padding:4px 10px;border-radius:4px\">PHARMACY<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:0\">\n          <div style=\"border:1.5px solid #102a43;border-radius:8px;padding:12px 16px;font-size:13.5px;line-height:1.45\"><strong>Patient requests a blood test<\u002Fstrong> — online or in store. Record the screening questions: symptoms, history, medicines.<\u002Fdiv>\n          <div style=\"height:18px;width:2px;background:#102a43;margin:0 auto\"><\u002Fdiv>\n          <div style=\"border:1.5px solid #a32d2d;background:#fcebeb;border-radius:8px;padding:12px 16px\">\n            <div style=\"font-size:13.5px;font-weight:700;color:#a32d2d;margin-bottom:5px\">Red flag symptoms?<\u002Fdiv>\n            <div style=\"font-size:12.5px;line-height:1.5;color:#7c2626\"><strong>YES<\u002Fstrong> — do not book. Advise same-day GP, or 999 if life-threatening. Record symptoms, advice, time, staff name. <em>End here.<\u002Fem><\u002Fdiv>\n            <div style=\"font-size:12.5px;line-height:1.5;color:#7c2626;margin-top:4px\"><strong>NO<\u002Fstrong> — continue below.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"height:18px;width:2px;background:#102a43;margin:0 auto\"><\u002Fdiv>\n          <div style=\"border:1.5px solid #7a5400;background:#fff7e6;border-radius:8px;padding:12px 16px\">\n            <div style=\"font-size:13.5px;font-weight:700;color:#7a5400;margin-bottom:5px\">Contraindications?<\u002Fdiv>\n            <div style=\"font-size:12.5px;line-height:1.5;color:#7a5400\">Bleeding disorder or anticoagulation, known blood-borne virus, severe needle phobia, unable to consent. <strong>YES<\u002Fstrong> — exclude or refer for clinician review; explain why; document the reason. <strong>NO<\u002Fstrong> — patient is eligible.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"height:18px;width:2px;background:#102a43;margin:0 auto\"><\u002Fdiv>\n          <div style=\"border:1.5px solid #0f6e56;background:#e1f5ee;border-radius:8px;padding:12px 16px;font-size:13.5px;line-height:1.45;color:#0c5c47\"><strong>Eligible — book.<\u002Fstrong> Issue PIL, confirm the panel and its preparation, send confirmation, and tell the patient that our clinical team will contact them with results.<\u002Fdiv>\n          <div style=\"height:18px;width:2px;background:#102a43;margin:0 auto\"><\u002Fdiv>\n          <div style=\"border:1.5px solid #102a43;border-radius:8px;padding:12px 16px;font-size:13.5px;line-height:1.45\"><strong>Patient attends.<\u002Fstrong> Greet, ID check, take consent, re-check eligibility face to face → proceed to venepuncture.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"a4\" style=\"width:100%;max-width:794px;background:#fff;border:1px solid #dfe0e0;border-radius:6px;padding:46px 44px;box-shadow:0 2px 10px rgba(16,42,67,.07)\">\n        <div style=\"display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid #a32d2d;padding-bottom:10px;margin-bottom:22px\">\n          <div><div style=\"font-size:19px;font-weight:700\">Flowchart 4 — Anaphylaxis emergency response<\u002Fdiv><div style=\"font-size:12px;color:#6b7280;margin-top:3px\">Pharmacy (spoke) responsible<\u002Fdiv><\u002Fdiv>\n          <div style=\"font-size:11px;font-weight:700;color:#fff;background:#a32d2d;padding:4px 10px;border-radius:4px\">EMERGENCY<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(2,1fr);gap:12px\">\n          <div style=\"border:1.5px solid #a32d2d;border-radius:8px;padding:12px 14px\"><div style=\"font-size:12px;font-weight:700;color:#a32d2d;margin-bottom:4px\">1 · RECOGNISE<\u002Fdiv><div style=\"font-size:12.5px;line-height:1.5\">Rash or urticaria, swelling of face, tongue or throat, difficulty breathing, wheeze, stridor, low blood pressure, collapse. Any combination of skin and systemic features.<\u002Fdiv><\u002Fdiv>\n          <div style=\"border:1.5px solid #a32d2d;border-radius:8px;padding:12px 14px\"><div style=\"font-size:12px;font-weight:700;color:#a32d2d;margin-bottom:4px\">2 · STOP &amp; CALL 999<\u002Fdiv><div style=\"font-size:12.5px;line-height:1.5\">Stop the procedure. Call 999 and say “anaphylaxis”. Note the time. Never leave the patient alone.<\u002Fdiv><\u002Fdiv>\n          <div style=\"border:1.5px solid #dfe0e0;border-radius:8px;padding:12px 14px\"><div style=\"font-size:12px;font-weight:700;margin-bottom:4px\">3 · POSITION<\u002Fdiv><div style=\"font-size:12.5px;line-height:1.5\">Lie flat, raise legs. If breathing is difficult, allow them to sit up. Loosen tight clothing.<\u002Fdiv><\u002Fdiv>\n          <div style=\"border:1.5px solid #a32d2d;background:#fcebeb;border-radius:8px;padding:12px 14px\"><div style=\"font-size:12px;font-weight:700;color:#a32d2d;margin-bottom:4px\">4 · ADRENALINE IM<\u002Fdiv><div style=\"font-size:12.5px;line-height:1.5;color:#7c2626\">0.5 mg IM into the anterolateral thigh, per current guideline and local authorised arrangements. Through clothing if needed. Note the time.<\u002Fdiv><\u002Fdiv>\n          <div style=\"border:1.5px solid #dfe0e0;border-radius:8px;padding:12px 14px\"><div style=\"font-size:12px;font-weight:700;margin-bottom:4px\">5 · MONITOR<\u002Fdiv><div style=\"font-size:12.5px;line-height:1.5\">Airway, breathing, pulse, consciousness — every 2 minutes. Reassure the patient.<\u002Fdiv><\u002Fdiv>\n          <div style=\"border:1.5px solid #a32d2d;border-radius:8px;padding:12px 14px\"><div style=\"font-size:12px;font-weight:700;color:#a32d2d;margin-bottom:4px\">6 · REASSESS AT 5 MIN<\u002Fdiv><div style=\"font-size:12.5px;line-height:1.5\">No improvement — second dose 0.5 mg IM. Note the time.<\u002Fdiv><\u002Fdiv>\n          <div style=\"border:1.5px solid #dfe0e0;border-radius:8px;padding:12px 14px\"><div style=\"font-size:12px;font-weight:700;margin-bottom:4px\">7 · CPR IF NEEDED<\u002Fdiv><div style=\"font-size:12.5px;line-height:1.5\">Stops breathing or loses pulse — start CPR 30:2, use AED if available, continue until the ambulance arrives.<\u002Fdiv><\u002Fdiv>\n          <div style=\"border:1.5px solid #dfe0e0;border-radius:8px;padding:12px 14px\"><div style=\"font-size:12px;font-weight:700;margin-bottom:4px\">8 · HANDOVER<\u002Fdiv><div style=\"font-size:12.5px;line-height:1.5\">Tell paramedics: what happened, time of onset, adrenaline doses and times, known history.<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border:1.5px solid #102a43;border-radius:8px;padding:12px 14px;margin-top:12px\"><div style=\"font-size:12px;font-weight:700;margin-bottom:4px\">9 · AFTERWARDS<\u002Fdiv><div style=\"font-size:12.5px;line-height:1.5\">Record as a serious incident. MHRA Yellow Card if device-related. Notify the clinical team and the Clinical Lead immediately; the RP notifies CQC if notifiable. Debrief the team, arrange occupational health support, and keep the used auto-injectors for investigation.<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"a4\" style=\"width:100%;max-width:794px;background:#fff;border:1px solid #dfe0e0;border-radius:6px;padding:46px 44px;box-shadow:0 2px 10px rgba(16,42,67,.07)\">\n        <div style=\"display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid #102a43;padding-bottom:10px;margin-bottom:22px\">\n          <div><div style=\"font-size:19px;font-weight:700\">Flowchart 3 — Venepuncture complications<\u002Fdiv><div style=\"font-size:12px;color:#6b7280;margin-top:3px\">Collecting site responsible · notify the clinical team of any complication<\u002Fdiv><\u002Fdiv>\n          <div style=\"font-size:11px;font-weight:700;color:#fff;background:#102a43;padding:4px 10px;border-radius:4px\">PHARMACY<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:12px\">\n          <div style=\"border:1.5px solid #dfe0e0;border-radius:8px;padding:13px 16px\"><div style=\"font-size:13.5px;font-weight:700;margin-bottom:5px\">Vasovagal syncope — fainting<\u002Fdiv><div style=\"font-size:12.5px;line-height:1.55\">Stop. Remove tourniquet and needle. Lie flat, raise legs, loosen clothing. Monitor consciousness and breathing. Unconscious over 1 minute, or seizure — call 999. On recovery: water, lie down 15 minutes minimum, do not let them drive. Record in the clinical record; raise an incident record if 999 called; notify the clinical team.<\u002Fdiv><\u002Fdiv>\n          <div style=\"border:1.5px solid #dfe0e0;border-radius:8px;padding:13px 16px\"><div style=\"font-size:13.5px;font-weight:700;margin-bottom:5px\">Severe pain or possible nerve damage<\u002Fdiv><div style=\"font-size:12.5px;line-height:1.55\">Stop and remove the needle immediately. Pressure and dressing. Ask specifically about numbness, tingling and shooting pain. Any nerve symptoms — GP same day, with written advice on what to watch for. Raise an incident record, notify the RP and the clinical team for follow-up.<\u002Fdiv><\u002Fdiv>\n          <div style=\"border:1.5px solid #dfe0e0;border-radius:8px;padding:13px 16px\"><div style=\"font-size:13.5px;font-weight:700;margin-bottom:5px\">Excessive bleeding or haematoma<\u002Fdiv><div style=\"font-size:12.5px;line-height:1.55\">Stop. Firm pressure 5 minutes, elevate the arm, wrapped ice pack. Check for anticoagulants. Bleeding beyond 10 minutes — call 999. Give written aftercare advice. Raise an incident record, notify the RP and the clinical team.<\u002Fdiv><\u002Fdiv>\n          <div style=\"border:1.5px solid #102a43;background:#eef3f8;border-radius:8px;padding:13px 16px\"><div style=\"font-size:13.5px;font-weight:700;margin-bottom:5px\">All complications<\u002Fdiv><div style=\"font-size:12.5px;line-height:1.55\">Incident record within 24 hours. Notify the RP the same day. Review at the next governance meeting and share the learning at quarterly joint review.<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"a4\" style=\"width:100%;max-width:794px;background:#fff;border:1px solid #dfe0e0;border-radius:6px;padding:46px 44px;box-shadow:0 2px 10px rgba(16,42,67,.07)\">\n        <div style=\"display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid #102a43;padding-bottom:10px;margin-bottom:22px\">\n          <div><div style=\"font-size:19px;font-weight:700\">Flowchart 5 — Sample handling error<\u002Fdiv><div style=\"font-size:12px;color:#6b7280;margin-top:3px\">Collecting site responsible · no result can be issued until resolved<\u002Fdiv><\u002Fdiv>\n          <div style=\"font-size:11px;font-weight:700;color:#fff;background:#102a43;padding:4px 10px;border-radius:4px\">PHARMACY<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:12px\">\n          <div style=\"border:1.5px solid #7a5400;background:#fff7e6;border-radius:8px;padding:13px 16px\"><div style=\"font-size:13.5px;font-weight:700;color:#7a5400;margin-bottom:5px\">Found before dispatch<\u002Fdiv><div style=\"font-size:12.5px;line-height:1.55;color:#7a5400\">Do not dispatch. Quarantine in the fridge labelled “DO NOT USE — ERROR”. Contact the patient immediately, apologise (duty of candour), arrange priority re-collection. Dispose as clinical waste and record the disposal. Raise rejection and incident records. Notify the clinical team.<\u002Fdiv><\u002Fdiv>\n          <div style=\"border:1.5px solid #a32d2d;background:#fcebeb;border-radius:8px;padding:13px 16px\"><div style=\"font-size:13.5px;font-weight:700;color:#a32d2d;margin-bottom:5px\">Found after dispatch<\u002Fdiv><div style=\"font-size:12.5px;line-height:1.55;color:#7c2626\">Phone the laboratory immediately — quarantine, do not analyse, return or dispose. Contact the patient immediately and apologise. Arrange re-collection. Confirm in writing that no results will be issued for the incorrect sample. Raise rejection and incident records. Notify the clinical team.<\u002Fdiv><\u002Fdiv>\n          <div style=\"border:1.5px solid #a32d2d;border-radius:8px;padding:13px 16px\"><div style=\"font-size:13.5px;font-weight:700;color:#a32d2d;margin-bottom:5px\">Could it have caused harm? (e.g. wrong patient's results issued)<\u002Fdiv><div style=\"font-size:12.5px;line-height:1.55\">Treat as a serious incident. Escalate to the RP and the Clinical Lead immediately. CQC notification. Full investigation and RCA within 30 days. Duty of candour to every affected patient. Review all recent samples.<\u002Fdiv><\u002Fdiv>\n          <div style=\"border:1.5px solid #102a43;background:#eef3f8;border-radius:8px;padding:13px 16px\"><div style=\"font-size:13.5px;font-weight:700;margin-bottom:5px\">Corrective actions — every error<\u002Fdiv><div style=\"font-size:12.5px;line-height:1.55\">Retrain the staff involved. Review the double-check. Consider added controls such as barcode scanning at every handover. Share learning at the team meeting and at joint review. Monitor for recurrence and track the action plan to completion.<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"a4\" style=\"width:100%;max-width:794px;background:#fff;border:1px solid #dfe0e0;border-radius:6px;padding:46px 44px;box-shadow:0 2px 10px rgba(16,42,67,.07)\">\n        <div style=\"display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid #5b3d8c;padding-bottom:10px;margin-bottom:22px\">\n          <div><div style=\"font-size:19px;font-weight:700\">Flowchart 2 — Critical laboratory results<\u002Fdiv><div style=\"font-size:12px;color:#6b7280;margin-top:3px\">Everest clinical team (CQC-registered) responsible · collecting-site staff must not manage results<\u002Fdiv><\u002Fdiv>\n          <div style=\"font-size:11px;font-weight:700;color:#fff;background:#5b3d8c;padding:4px 10px;border-radius:4px\">CLINICAL TEAM<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:0\">\n          <div style=\"border:1.5px solid #5b3d8c;border-radius:8px;padding:12px 16px;font-size:13px;line-height:1.5\"><strong>Laboratory identifies a critical result<\u002Fstrong> — for example K⁺ above 6.5, Hb below 70, glucose below 3.0. The lab telephones the duty clinician; an electronic alert alone is not sufficient. Time and person recorded.<\u002Fdiv>\n          <div style=\"height:16px;width:2px;background:#5b3d8c;margin:0 auto\"><\u002Fdiv>\n          <div style=\"border:1.5px solid #5b3d8c;background:#f2edfa;border-radius:8px;padding:12px 16px;font-size:13px;line-height:1.5;color:#4a2f78\"><strong>Duty clinician reviews in clinical context.<\u002Fstrong> Is this immediately life-threatening?<\u002Fdiv>\n          <div style=\"height:16px;width:2px;background:#5b3d8c;margin:0 auto\"><\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:12px\">\n            <div style=\"border:1.5px solid #a32d2d;background:#fcebeb;border-radius:8px;padding:12px 14px\"><div style=\"font-size:12.5px;font-weight:700;color:#a32d2d;margin-bottom:4px\">YES — life-threatening<\u002Fdiv><div style=\"font-size:12.5px;line-height:1.5;color:#7c2626\">Phone the patient within 30 minutes, 3 attempts across all numbers, then the emergency contact. Advise 999 or A&amp;E now, do not drive. Alert the GP practice by phone. Uncontactable — escalate to Clinical Lead, consider a welfare check, call 999 with the address.<\u002Fdiv><\u002Fdiv>\n            <div style=\"border:1.5px solid #7a5400;background:#fff7e6;border-radius:8px;padding:12px 14px\"><div style=\"font-size:12.5px;font-weight:700;color:#7a5400;margin-bottom:4px\">NO — same-day urgent<\u002Fdiv><div style=\"font-size:12.5px;line-height:1.5;color:#7a5400\">Phone within 4 hours. Explain the result, advise a same-day GP appointment or walk-in centre. Issue a GP letter. Safety-net: what to watch for, when to call 999, the 111 number.<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"height:16px;width:2px;background:#5b3d8c;margin:0 auto\"><\u002Fdiv>\n          <div style=\"border:1.5px solid #5b3d8c;border-radius:8px;padding:12px 16px;font-size:13px;line-height:1.5\"><strong>All critical results.<\u002Fstrong> Document in the clinical record with timestamps and the patient's response. Complete an incident record. GP notification within 24 hours. Present at governance; share learning with the collecting site at quarterly review.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isPartner }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"max-width:1400px;margin:0 auto;padding:28px 24px 80px\">\n    <div style=\"margin-bottom:24px\">\n      <div style=\"font-size:24px;font-weight:600;margin-bottom:6px\">Third-party pharmacy model<\u002Fdiv>\n      <div style=\"font-size:14px;color:#6b7280;line-height:1.6;max-width:760px\">An independent pharmacy sells no test and interprets no result. It sells a room, a trained pair of hands and a compliant sample. Everest owns demand, the patient relationship, the CQC registration and the clinical record. That is the whole commercial logic: buy collection capacity, keep clinical accountability in one place.<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"background:#fff;border:1px solid #dfe0e0;border-radius:12px;padding:22px;margin-bottom:18px\">\n      <div style=\"font-size:16px;font-weight:600;margin-bottom:16px\">Who owns what<\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px\">\n        <div style=\"border-top:3px solid #0f6e56;background:#f7f6f2;border-radius:0 0 8px 8px;padding:14px 16px\">\n          <div style=\"font-size:12px;font-weight:700;color:#0f6e56;text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px\">Everest — hub<\u002Fdiv>\n          <div style=\"font-size:12.5px;line-height:1.6\">Patient portal and booking. Screening logic. Panel catalogue and pricing. Payment collection. Partner accreditation and audit. Courier and lab contracts. The patient-facing brand promise.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border-top:3px solid #102a43;background:#f7f6f2;border-radius:0 0 8px 8px;padding:14px 16px\">\n          <div style=\"font-size:12px;font-weight:700;color:#102a43;text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px\">Partner pharmacy (spoke)<\u002Fdiv>\n          <div style=\"font-size:12.5px;line-height:1.6\">Private clinical room and IPC standards. Competency-signed phlebotomists. Consent taking and documentation. Labelling and cold chain to courier handover. On-site emergency response. Its own phlebotomy records. No clinical interpretation, ever.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border-top:3px solid #7a5400;background:#f7f6f2;border-radius:0 0 8px 8px;padding:14px 16px\">\n          <div style=\"font-size:12px;font-weight:700;color:#7a5400;text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px\">Laboratory<\u002Fdiv>\n          <div style=\"font-size:12.5px;line-height:1.6\">UKAS ISO 15189 analysis. Rejection notices to the collecting site. Results and critical-value calls to the Everest clinical team only.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border-top:3px solid #5b3d8c;background:#f7f6f2;border-radius:0 0 8px 8px;padding:14px 16px\">\n          <div style=\"font-size:12px;font-weight:700;color:#5b3d8c;text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px\">Everest — clinical team (CQC-registered)<\u002Fdiv>\n          <div style=\"font-size:12.5px;line-height:1.6\">Holds the CQC registration for diagnostic and screening procedures. Clinical responsibility for every result regardless of which site collected it. Interpretation, patient contact, GP letters, escalation. Owns the clinical record. Clinical indemnity.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#fcebeb;border:1px solid #f0cdcd;border-radius:8px;padding:13px 16px;margin-top:14px;font-size:12.5px;line-height:1.6;color:#a32d2d\">The partner never receives a result, never holds a login to the clinical system, and never appears on a GP letter. Adding a site multiplies collection capacity without multiplying clinical accountability — that is what makes the model scale, and it is why Everest can hold one registration across the whole network instead of one per site.<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px;margin-bottom:18px\">\n      <div style=\"background:#fff;border:1px solid #dfe0e0;border-radius:12px;padding:22px\">\n        <div style=\"font-size:16px;font-weight:600;margin-bottom:4px\">Accreditation gate<\u002Fdiv>\n        <div style=\"font-size:12.5px;color:#6b7280;line-height:1.55;margin-bottom:16px\">A partner site is invisible to patients until every item is green. No exceptions, no soft launches.<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:9px\">\n          <div style=\"display:flex;gap:10px;align-items:flex-start\"><span style=\"flex:0 0 auto;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:100px;background:#e1f5ee;color:#0f6e56;margin-top:2px\">PASS<\u002Fspan><div style=\"flex:1;font-size:13px;line-height:1.5\"><strong>Premises<\u002Fstrong> — private clinical room, cleanable surfaces, hand hygiene, 2–8°C fridge with logging<\u002Fdiv><\u002Fdiv>\n          <div style=\"display:flex;gap:10px;align-items:flex-start\"><span style=\"flex:0 0 auto;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:100px;background:#e1f5ee;color:#0f6e56;margin-top:2px\">PASS<\u002Fspan><div style=\"flex:1;font-size:13px;line-height:1.5\"><strong>Equipment<\u002Fstrong> — venepuncture kit, safety-engineered sharps, sharps bins, in-date emergency kit<\u002Fdiv><\u002Fdiv>\n          <div style=\"display:flex;gap:10px;align-items:flex-start\"><span style=\"flex:0 0 auto;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:100px;background:#e1f5ee;color:#0f6e56;margin-top:2px\">PASS<\u002Fspan><div style=\"flex:1;font-size:13px;line-height:1.5\"><strong>Staffing<\u002Fstrong> — minimum two staff signed off: phlebotomy (5 supervised), BLS, anaphylaxis, IPC, IG<\u002Fdiv><\u002Fdiv>\n          <div style=\"display:flex;gap:10px;align-items:flex-start\"><span style=\"flex:0 0 auto;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:100px;background:#fff7e6;color:#7a5400;margin-top:2px\">OPEN<\u002Fspan><div style=\"flex:1;font-size:13px;line-height:1.5\"><strong>Occupational health<\u002Fstrong> — hepatitis B vaccination and titre for all phlebotomy staff <span style=\"color:#7a5400\">(1 of 2 complete)<\u002Fspan><\u002Fdiv><\u002Fdiv>\n          <div style=\"display:flex;gap:10px;align-items:flex-start\"><span style=\"flex:0 0 auto;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:100px;background:#e1f5ee;color:#0f6e56;margin-top:2px\">PASS<\u002Fspan><div style=\"flex:1;font-size:13px;line-height:1.5\"><strong>Governance<\u002Fstrong> — SOP suite adopted, COSHH and sharps risk assessments, waste contract, indemnity evidenced<\u002Fdiv><\u002Fdiv>\n          <div style=\"display:flex;gap:10px;align-items:flex-start\"><span style=\"flex:0 0 auto;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:100px;background:#e1f5ee;color:#0f6e56;margin-top:2px\">PASS<\u002Fspan><div style=\"flex:1;font-size:13px;line-height:1.5\"><strong>Contract<\u002Fstrong> — signed spoke agreement, data sharing agreement (Everest as controller for clinical data), agreed SLAs and fee schedule<\u002Fdiv><\u002Fdiv>\n          <div style=\"display:flex;gap:10px;align-items:flex-start\"><span style=\"flex:0 0 auto;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:100px;background:#f1f1f0;color:#6b7280;margin-top:2px\">TODO<\u002Fspan><div style=\"flex:1;font-size:13px;line-height:1.5\"><strong>Go-live audit<\u002Fstrong> — observed mock appointment end to end, including a deliberate labelling error<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#f7f6f2;border:1px solid #dfe0e0;border-radius:8px;padding:12px 14px;margin-top:16px;font-size:12.5px;line-height:1.55;color:#6b7280\">Reaccreditation e
